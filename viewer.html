    function renderManualDmnTable(xml, pathData) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xml, 'text/xml');
      
      // Get all decisions in the DMN file
      const decisions = xmlDoc.querySelectorAll('decision');
      
      if (decisions.length === 0) {
        const canvasDiv = getCanvas();
        canvasDiv.innerHTML = `
          <div class="error-page-container">
            <h3>⚠️ No Decision Tables Found</h3>
            <p>This DMN file contains no decision tables or is malformed.</p>
          </div>
        `;
        return;
      }
      
      // Set currentViewer to null since we're using manual rendering
      currentViewer = null;      
     
      const canvasDiv = getCanvas();
      const containerDiv = document.createElement('div');
      containerDiv.className = 'manual-dmn-container';
      
      createZoomControls();
      
      const zoomContainer = document.createElement('div');
      zoomContainer.className = 'table-zoom-container';
      
      // Extract decision key from filename as the primary key
      const fileName = pathData.fileName || '';
      
      // Check if this is a reference file (not executed for this claim)
      const isReferenceFile = fileName.includes('-REFERENCE-');
      
      if (isReferenceFile) {
        // Handle reference files that weren't executed for this claim
        const referenceDecisionKey = fileName.replace(/-REFERENCE-.*\.dmn$/, '');
        
        const referenceDiv = document.createElement('div');
        referenceDiv.className = 'reference-container';
        
        referenceDiv.innerHTML = `
          <div class="reference-icon">📋</div>
          <h3 class="reference-title">Reference Decision</h3>
          <p class="reference-key">${referenceDecisionKey}</p>
          <p class="reference-description">This decision definition exists in the system but was not executed for this claim.</p>
          <div class="reference-note">
            <strong>Note:</strong> This DMN file is included for reference only. 
            To see execution data and rule highlighting, view decisions that were actually executed during the claim processing.
          </div>
        `;
        
        zoomContainer.appendChild(referenceDiv);
        containerDiv.appendChild(zoomContainer);
        canvasDiv.innerHTML = '';
        canvasDiv.appendChild(containerDiv);
        return;
      }
      
      // Pattern: {decision-key}-{businessKey}-{decision-instance-id}.dmn
      // We need to remove the businessKey and instance ID parts but keep the decision key
      // BusinessKey is typically numeric, instance ID is UUID format
      let expectedDecisionId = fileName.replace('.dmn', '');
      
      // Remove the Business Key (numeric) and instance ID (UUID) from the end
      // Pattern: -[businessKey]-[uuid-pattern]
      expectedDecisionId = expectedDecisionId.replace(/-\d+-[a-f0-9-]+$/, '');
      
      let foundMatchingDecision = false;
      decisions.forEach((decision, decisionIndex) => {
        const currentDecisionName = decision.getAttribute('name');
        const decisionId = decision.getAttribute('id');
        
        // Match primarily by decision ID extracted from filename
        const isMatchingDecision = expectedDecisionId && expectedDecisionId === decisionId;
        
        if (!isMatchingDecision) {
          return;
        }
        
        foundMatchingDecision = true;
        
        const decisionTable = decision.querySelector('decisionTable');
        const literalExpression = decision.querySelector('literalExpression');
        
        if (!decisionTable && !literalExpression) {
          return;
        }
        
        if (literalExpression) {
          renderLiteralExpression(decision, literalExpression, pathData, zoomContainer, decisionIndex, decisions.length);
          containerDiv.appendChild(zoomContainer);
          return;
        } else if (decisionTable) {
          // Render decision table with frozen headers and execution highlighting
        } else {
          return;
        }
        
        const decisionName = decision.getAttribute('name') || decision.getAttribute('id') || 'Decision Table';
        const hitPolicy = decisionTable.getAttribute('hitPolicy') || 'UNIQUE';
        
        // Build table HTML from DMN XML - scope queries to this specific decision
        // Build table HTML from DMN XML - scope queries to this specific decision
        const inputs = decision.querySelectorAll('input');
        const outputs = decision.querySelectorAll('output'); 
        const rules = decision.querySelectorAll('rule');
        
        // Get evaluation data from new enhanced format - since we're only rendering the executed decision,
        // we can use all the execution data for this table
        const rawRules = pathData.executedRules || [];
        const activeRules = Array.isArray(rawRules) ? rawRules : [rawRules].filter(Boolean);
        
        // Check if we have specific rule IDs
        const hasSpecificRules = pathData.hasRuleIds === true || 
          activeRules.some(rule => rule !== 'decision-table' && rule.startsWith && rule.startsWith('DecisionRule_'));
        
        // Create the information header (outside of zoom)
        const infoHeaderHTML = `
          <div class="dmn-header-container">
            <h3 class="dmn-header-title">${decisionName}</h3>
            <p class="dmn-header-subtitle">Hit Policy: ${hitPolicy}</p>
            ${hasSpecificRules ? 
              `<div class="execution-success"><p>✅ Specific rule execution data captured via enhanced API</p><p>Executed rules: ${activeRules.join(', ')}</p></div>` :
              '<div class="execution-warning"><p>⚠️ Not Executed or No Lines Were Hit</p><p>This decision table was not executed with specific rule data. It may use literal expressions, have no matching conditions, or the Camunda instance may not provide detailed rule execution data.</p></div>'
            }
          </div>
        `;
        
        // Create the table content (inside zoom container)
        let tableHTML = `
          <div class="dmn-table-scroll-container dmn-table-scroll-main">
            <table id="dmn-decision-table" class="dmn-table-base">
        `;
        
        // Headers - Camunda style with When/Then/And language and data types
        tableHTML += '<thead>';
        
        // First row: When/Then labels (only show if we have columns)
        if (inputs.length > 0 || outputs.length > 0) {
          tableHTML += '<tr>';
          
          // Rule number column - spans 3 rows (When/Then, Column Labels, Type/Value)
          tableHTML += `<th class="dmn-header-rule-rowspan" rowspan="3">Rule</th>`;
          
          // Input columns header (When)
          if (inputs.length > 0) {
            tableHTML += `<th class="dmn-header-when-colspan" colspan="${inputs.length}">When</th>`;
          }
          
          // Output columns header (Then)
          if (outputs.length > 0) {
            tableHTML += `<th class="dmn-header-then-colspan" colspan="${outputs.length}">Then</th>`;
          }
          
          // Annotations column header - first row (spans 3 rows)
          tableHTML += `<th class="dmn-header-annotations-rowspan" rowspan="3">Annotations</th>`;
          
          tableHTML += '</tr>';
        }
        
        // Second row: Column labels
        tableHTML += '<tr>';
        if (inputs.length === 0 && outputs.length === 0) {
          tableHTML += `<th class="dmn-header-rule-single">Rule</th>`;
        }
        inputs.forEach((input, index) => {
          const label = input.getAttribute('label') || input.getAttribute('id');
          tableHTML += `<th class="dmn-header-input-label">${label}</th>`;
        });
        // Output columns - second row with column labels
        outputs.forEach(output => {
          const label = output.getAttribute('label') || output.getAttribute('name') || output.getAttribute('id');
          tableHTML += `<th class="dmn-header-output-label">${label}</th>`;
        });
        
        tableHTML += '</tr>';
        // Third row: Data types and input values with color coding
        tableHTML += '<tr>';
        inputs.forEach((input, index) => {
          const typeRef = input.querySelector('inputExpression')?.getAttribute('typeRef') || 'string';
          // Find the corresponding input value from execution data
          let inputValueDisplay = '';
          let matchingInput = undefined;
          if (pathData.inputs && Array.isArray(pathData.inputs)) {
            const label = input.getAttribute('label') || input.getAttribute('id');
            // Find input by clause name (most reliable) or clause ID
            matchingInput = pathData.inputs.find(inp => 
              inp.clauseName === label || 
              inp.clauseId === input.getAttribute('id')
            );
            if (matchingInput) {
              const inputValue = matchingInput.value;
              // Format the input value for display
              if (inputValue === null || inputValue === undefined) {
                inputValueDisplay = 'null';
              } else if (typeof inputValue === 'string') {
                inputValueDisplay = `"${String(inputValue)}"`;
              } else {
                inputValueDisplay = String(inputValue);
              }
            }
          }
          // Determine CSS class for value type styling
          let valueClass = 'input-value-default';
          if (inputValueDisplay === 'null') {
            valueClass = 'input-value-null';
          } else if (typeof matchingInput?.value === 'string') {
            valueClass = 'input-value-string';
          } else if (typeof matchingInput?.value === 'number') {
            valueClass = 'input-value-number';
          } else if (typeof matchingInput?.value === 'boolean') {
            valueClass = 'input-value-boolean';
          }
          tableHTML += `<th class="dmn-header-input-type">
            <div>(${typeRef})</div>
            ${inputValueDisplay ? `<div class="input-value-display ${valueClass}">Value: ${inputValueDisplay}</div>` : ''}
          </th>`;
        });
        // Output columns - third row with data types only
        outputs.forEach(output => {
          const typeRef = output.getAttribute('typeRef') || 'string';
          tableHTML += `<th class="dmn-header-output-type">
            <div>(${typeRef})</div>
          </th>`;
        });
        
        tableHTML += '</tr></thead>';
        
        // Rules
        tableHTML += '<tbody>';
        rules.forEach((rule, ruleIndex) => {
          const ruleNumber = ruleIndex + 1;
          const ruleId = rule.getAttribute('id');
          
          
          // Determine if this rule should be highlighted - since we're only showing the executed decision,
          // we can directly check if this rule ID is in the active rules
          const isHighlighted = hasSpecificRules && activeRules.includes(ruleId);
          
          const rowClass = isHighlighted ? 'dmn-row-highlighted' : 'dmn-row-normal';
          
          tableHTML += `<tr class="${rowClass}">`;
          
          // Rule number with conditional highlighting
          const ruleNumberClass = isHighlighted ? 'dmn-rule-number-highlighted' : 'dmn-rule-number-normal';
          tableHTML += `<td class="${ruleNumberClass}">${ruleNumber}</td>`;
          
          // Input entries - for each input column
          const inputEntries = rule.querySelectorAll('inputEntry');
          for (let i = 0; i < inputs.length; i++) {
            const entry = inputEntries[i];
            const text = entry ? (entry.querySelector('text')?.textContent || '') : '';
            const cellClass = isHighlighted ? 'dmn-cell-highlighted' : 'dmn-cell-normal';
            tableHTML += `<td class="${cellClass}">${text}</td>`;
          }
          
          // Output entries - for each output column
          const outputEntries = rule.querySelectorAll('outputEntry');
          for (let i = 0; i < outputs.length; i++) {
            const entry = outputEntries[i];
            const text = entry ? (entry.querySelector('text')?.textContent || '') : '';
            const cellClass = isHighlighted ? 'dmn-cell-highlighted' : 'dmn-cell-normal';
            tableHTML += `<td class="${cellClass}">${text}</td>`;
          }
          
          // Annotations column - extract description from rule
          const descriptionElement = rule.querySelector('description');
          const descriptionText = descriptionElement ? descriptionElement.textContent.trim() : '';
          const annotationCellClass = isHighlighted ? 'dmn-annotation-highlighted' : 'dmn-annotation-normal';
          tableHTML += `<td class="${annotationCellClass}" title="${descriptionText}">${descriptionText}</td>`;
          
          tableHTML += '</tr>';
        });
        tableHTML += '</tbody></table></div>';
        
        // Create info header div (inside zoom container like literal expressions)
        const infoHeaderDiv = document.createElement('div');
        infoHeaderDiv.innerHTML = infoHeaderHTML;
        
        const tableContentDiv = document.createElement('div');
        tableContentDiv.innerHTML = tableHTML;
        tableContentDiv.className = `dmn-table-content${decisionIndex < decisions.length - 1 ? ' has-margin' : ''}`;
        
        containerDiv.appendChild(zoomContainer);
        zoomContainer.appendChild(infoHeaderDiv);
        zoomContainer.appendChild(tableContentDiv);

        // Add table size detection and responsive class application
        setTimeout(() => {
          const tableScrollContainer = tableContentDiv.querySelector('.dmn-table-scroll-main');
          const table = tableScrollContainer.querySelector('.dmn-table-base');
          
          if (table && tableScrollContainer) {
            // Count actual data columns by looking at the second header row (column labels)
            const secondHeaderRow = table.querySelector('thead tr:nth-child(2)');
            let totalColumns = 0;
            
            if (secondHeaderRow) {
              // Count all th elements in the second row (this gives us the actual column count)
              totalColumns = secondHeaderRow.querySelectorAll('th').length;
            } else {
              // Fallback: count from first row if second row doesn't exist
              const firstHeaderRow = table.querySelector('thead tr:first-child');
              totalColumns = firstHeaderRow ? firstHeaderRow.children.length : 0;
            }
            
            // Apply appropriate class based on column count
            if (totalColumns > 6) {
              // Large table - many columns, use auto layout
              tableScrollContainer.classList.add('large-table');
              tableScrollContainer.classList.remove('small-table');
            } else {
              // Small table - fewer columns, use fixed layout for even distribution
              tableScrollContainer.classList.add('small-table');
              tableScrollContainer.classList.remove('large-table');
            }
          }
          
          // Wait for DOM to update, then recalculate third row positioning
          recalculateThirdRowPosition();
        }, 0);
      });
      
      if (!foundMatchingDecision) {
        const errorDiv = document.createElement('div');
        errorDiv.className = 'error-container';
        errorDiv.innerHTML = `
          <h3 class="dmn-no-match-title">⚠️ No Matching Decision Table Found</h3>
          <p class="dmn-no-match-text">Expected to find decision with ID: "<strong>${expectedDecisionId}</strong>"</p>
          <p class="dmn-no-match-available">Available decisions in this DMN file: ${Array.from(decisions).map(d => d.getAttribute('name')).join(', ')}</p>
        `;
        zoomContainer.appendChild(errorDiv);
      }
      
      // If no matching decision was found, show all decisions or a helpful message
      if (!foundMatchingDecision) {
        console.warn('No matching decision found. Expected decision ID:', expectedDecisionId);
        const errorDiv = document.createElement('div');
        errorDiv.className = 'error-container';
        errorDiv.innerHTML = `
          <h3>⚠️ Decision Not Found</h3>
          <p>Expected decision ID: <strong>${expectedDecisionId || 'undefined'}</strong></p>
          <p>Available decisions: ${Array.from(decisions).map(d => d.getAttribute('id') + ' (' + (d.getAttribute('name') || 'no name') + ')').join(', ')}</p>
        `;
        zoomContainer.appendChild(errorDiv);
      }
      
      canvasDiv.innerHTML = '';
      canvasDiv.appendChild(containerDiv);
      
      setupTableZoomMouseWheel();
      updateCopyTableButtonVisibility();
    }

    /**
     * Render literal expressions (FEEL expressions) with syntax highlighting and execution status.
     * Shows whether the expression was executed and provides process visibility.
     */
    function renderLiteralExpression(decision, literalExpression, pathData, containerDiv, decisionIndex, totalDecisions) {
      const decisionName = decision.getAttribute('name') || decision.getAttribute('id') || 'Literal Expression';
      const expressionLanguage = literalExpression.getAttribute('expressionLanguage') || 'feel';
      const expressionText = literalExpression.querySelector('text')?.textContent || 'No expression text found';
      
      // Create the main container with font-based zoom support and data attributes for base sizes
      const manualExpressionDiv = document.createElement('div');
      manualExpressionDiv.className = 'literal-expression-container';
      manualExpressionDiv.setAttribute('data-base-font-size', '11');
      manualExpressionDiv.style.cssText = `
        margin-bottom: ${decisionIndex < totalDecisions - 1 ? '40px' : '0'};
        font-size: ${11 * tableZoomLevel}px;
      `;
      
      // Check execution status
      const hasExecutedRules = pathData.executedRules && pathData.executedRules.length > 0;
      const hasRealExecutionData = hasExecutedRules && 
        !(pathData.executedRules.length === 1 && pathData.executedRules[0] === 'decision-table');
      
      const headerDiv = document.createElement('div');
      headerDiv.className = 'info-header';
      
      const titleElement = document.createElement('h3');
      titleElement.className = 'literal-expression-title';
      titleElement.setAttribute('data-base-font-size', '14');
      titleElement.style.fontSize = `${14 * tableZoomLevel}px`;
      titleElement.textContent = `${decisionName} (Literal Expression)`;
      headerDiv.appendChild(titleElement);
      
      const languageElement = document.createElement('p');
      languageElement.className = 'literal-expression-language';
      languageElement.setAttribute('data-base-font-size', '11');
      languageElement.style.fontSize = `${11 * tableZoomLevel}px`;
      languageElement.textContent = `Language: ${expressionLanguage}`;
      headerDiv.appendChild(languageElement);
      
      if (hasRealExecutionData) {
        const successDiv = document.createElement('div');
        successDiv.className = 'literal-expression-success';
        const successP = document.createElement('p');
        successP.setAttribute('data-base-font-size', '12');
        successP.style.fontSize = `${12 * tableZoomLevel}px`;
        successP.textContent = '✅ Decision executed successfully';
        successDiv.appendChild(successP);
        headerDiv.appendChild(successDiv);
      } else {
        const warningContainer = document.createElement('div');
        warningContainer.className = 'warning-container';
        
        const warningTitle = document.createElement('p');
        warningTitle.className = 'literal-expression-warning-title';
        warningTitle.setAttribute('data-base-font-size', '13');
        warningTitle.style.fontSize = `${13 * tableZoomLevel}px`;
        warningTitle.textContent = '⚠️ No specific execution data available';
        warningContainer.appendChild(warningTitle);
        
        const warningDesc = document.createElement('p');
        warningDesc.className = 'literal-expression-warning-desc';
        warningDesc.setAttribute('data-base-font-size', '11');
        warningDesc.style.fontSize = `${11 * tableZoomLevel}px`;
        warningDesc.textContent = 'This literal expression was executed but only generic execution data is available.';
        warningContainer.appendChild(warningDesc);
        
        headerDiv.appendChild(warningContainer);
      }
      
      manualExpressionDiv.appendChild(headerDiv);
      
      const contentDiv = document.createElement('div');
      contentDiv.className = 'content-wrapper';
      
      const expressionTitle = document.createElement('h4');
      expressionTitle.className = 'expression-title';
      expressionTitle.setAttribute('data-base-font-size', '12');
      expressionTitle.style.fontSize = `${12 * tableZoomLevel}px`;
      expressionTitle.textContent = 'Expression:';
      contentDiv.appendChild(expressionTitle);
      
      const expressionPre = document.createElement('pre');
      expressionPre.className = 'expression-code';
      expressionPre.setAttribute('data-base-font-size', '10');
      expressionPre.style.fontSize = `${10 * tableZoomLevel}px`;
      expressionPre.textContent = expressionText;
      contentDiv.appendChild(expressionPre);
      
      manualExpressionDiv.appendChild(contentDiv);
      
      containerDiv.appendChild(manualExpressionDiv);
    }

    //#region [================== LOG MANAGEMENT FUNCTIONS ==================]
    /**
     * Functions for managing session-based log data from PowerShell data fetching operations.
     * Each tab session maintains its own log history that persists during the session.
     * Provides clipboard copy and file opening functionality for process analysis.
     */
    async function copyLogToClipboard() {
      try {
        const response = await fetch(`/get-log?sessionId=${sessionId}`);
        const data = await response.json();
        
        if (!data.exists) {
          showWarningMessage('No log entries found for this session.');
          return;
        }
        
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(data.content);
            showSuccessMessage('Session log copied to clipboard!');
          } else {
            throw new Error('Clipboard API not available');
          }
        } catch (clipboardError) {
          const textArea = document.createElement('textarea');
          textArea.value = data.content;
          textArea.style.position = 'fixed';
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          document.execCommand('Copy');
          document.body.removeChild(textArea);
          showSuccessMessage('Session log copied to clipboard! (fallback method)');
        }
      } catch (error) {
        console.error('Error copying log to clipboard:', error);
        showErrorMessage('Failed to copy session log to clipboard. Please try again.');
      }
    }

    /**
     * Open the session log in the system's default text viewer.
     * Creates a temporary log file and opens it with the default application.
     */
    async function viewSessionLog() {
      try {
        const response = await fetch(`/get-log?sessionId=${sessionId}`);
        const data = await response.json();
        
        if (!data.exists) {
          showWarningMessage('No log entries found for this session.');
          return;
        }
        
        const viewResponse = await fetch('/view-log', { 
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ sessionId: sessionId })
        });
        
        if (!viewResponse.ok) {
          throw new Error('Failed to open session log');
        }
        
        const result = await viewResponse.json();
        if (result.success) {
          // Display the log content in a modal
          document.getElementById('logModalTitle').textContent = `Session Log: ${result.sessionId}`;
          document.getElementById('logModalBody').textContent = result.content;
          document.getElementById('logModal').style.display = 'block';
          
          showInfoMessage('Session log opened', false);
          setTimeout(() => hideMessage(), 2000);
        }
      } catch (error) {
        console.error('Error opening session log:', error);
        showErrorMessage('Failed to open session log. Please try again.');
      }
    }

      document.getElementById('logModal').style.display = 'none';

    /**
     * Copy DMN table data to clipboard for Excel and Word
     */
    async function copyTableToClipboard() {
      try {
        // Find the table
        const customTable = document.querySelector('#dmn-decision-table');
        const nativeTable = document.querySelector('.dmn-js-container table');
        const table = customTable || nativeTable;
        
        if (!table) {
          showWarningMessage('No table found to copy.');
          return;
        }
        
        // Get all rows and build TSV for Excel
        const rows = table.querySelectorAll('tr');
        const tsvRows = [];
        const htmlRows = [];
        
        rows.forEach(row => {
          const cells = row.querySelectorAll('th, td');
          const cellTexts = [];
          const htmlCells = [];
          
          cells.forEach(cell => {
            let text = cell.textContent || '';
            text = text.trim().replace(/\s+/g, ' ');
            
            // Handle colspan by adding empty cells for TSV
            const colspan = parseInt(cell.getAttribute('colspan') || '1');
            cellTexts.push(text);
            for (let i = 1; i < colspan; i++) {
              cellTexts.push('');
            }
            
            // Create HTML cell for Word with proper attributes
            const cellTag = cell.tagName.toLowerCase();
            
            // Check if this cell/row is highlighted (execution path)
            const computedStyle = getComputedStyle(cell);
            const bgColor = computedStyle.backgroundColor;
            const isHighlighted = bgColor.includes('173, 216, 230') || // rgba(173, 216, 230, ...)
                                 bgColor === 'rgba(173, 216, 230, 0.6)' ||
                                 bgColor === 'rgb(173, 216, 230)' ||
                                 cell.closest('tr').style.background.includes('173, 216, 230');
            
            let style = ' style="border: 1px solid #000000; padding: 4pt 6pt 4pt 6pt; text-align: left; vertical-align: top; mso-border-alt: solid #000000 0.5pt;"';
            
            if (cellTag === 'th') {
              style = ' style="border: 1px solid #000000; padding: 4pt 6pt 4pt 6pt; background-color: #f0f0f0; font-weight: bold; text-align: center; vertical-align: top; mso-border-alt: solid #000000 0.5pt;"';
            } else if (isHighlighted) {
              // Highlighted execution path cells - light blue background
              style = ' style="border: 1px solid #000000; padding: 4pt 6pt 4pt 6pt; background-color: #ADD8E6; text-align: left; vertical-align: top; mso-border-alt: solid #000000 0.5pt; font-weight: bold;"';
            }
            
            // Preserve colspan and rowspan for Word with proper MSO attributes
            let attributes = '';
            if (cell.hasAttribute('colspan') && cell.getAttribute('colspan') !== '1') {
              const colspanVal = cell.getAttribute('colspan');
              attributes += ` colspan="${colspanVal}"`;
            }
            if (cell.hasAttribute('rowspan') && cell.getAttribute('rowspan') !== '1') {
              const rowspanVal = cell.getAttribute('rowspan');
              attributes += ` rowspan="${rowspanVal}"`;
            }
            
            // Escape HTML entities in cell text for proper Word rendering
            const escapedText = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            
            htmlCells.push(`<${cellTag}${attributes}${style}>${escapedText}</${cellTag}>`);
          });
          
          if (cellTexts.length > 0) {
            tsvRows.push(cellTexts.join('\t'));
            htmlRows.push(`<tr>${htmlCells.join('')}</tr>`);
          }
        });
        
        const tsvData = tsvRows.join('\n');
        
        // Create complete HTML document for Word
        const htmlTable = `<table border="1" style="border-collapse: collapse; width: 100%; font-family: Arial, sans-serif; border: 2px solid #000;">
          ${htmlRows.join('\n')}
        </table>`;
        
        const wordDocument = `<!DOCTYPE html>
<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word">
<head>
<meta charset="UTF-8">
<meta name="ProgId" content="Word.Document">
<meta name="Generator" content="Microsoft Word 15">
<meta name="Originator" content="Microsoft Word 15">
<!--[if !mso]>
<style>
v\\:* {behavior:url(#default#VML);}
o\\:* {behavior:url(#default#VML);}
w\\:* {behavior:url(#default#VML);}
.shape {behavior:url(#default#VML);}
</style>
<![endif]-->
<style>
@page {
  margin: 1.0in;
}
body {
  font-family: Arial, sans-serif;
  font-size: 11pt;
  margin: 0;
  padding: 0;
}
table {
  border-collapse: collapse;
  width: 100%;
  font-family: Arial, sans-serif;
  border: 2px solid #000000;
  mso-table-lspace: 0pt;
  mso-table-rspace: 0pt;
  mso-table-anchor-vertical: page;
  mso-table-anchor-horizontal: column;
  mso-table-left: left;
  mso-table-margin-left: 0pt;
  mso-table-margin-right: 0pt;
}
th, td {
  border: 1px solid #000000;
  padding: 4pt 6pt 4pt 6pt;
  text-align: left;
  vertical-align: top;
  mso-border-alt: solid #000000 0.5pt;
}
th {
  background-color: #f0f0f0;
  font-weight: bold;
  text-align: center;
}
</style>
</head>
<body>
${htmlTable}
</body>
</html>`;
        
        // Copy both formats to clipboard
        try {
          if (navigator.clipboard && navigator.clipboard.write) {
            const clipboardItem = new ClipboardItem({
              'text/html': new Blob([wordDocument], { type: 'text/html' }),
              'text/plain': new Blob([tsvData], { type: 'text/plain' })
            });
            
            await navigator.clipboard.write([clipboardItem]);
            showSuccessMessage('Table copied! Paste into Excel or Word for formatted table.');
          } else {
            // Fallback to plain text
            await navigator.clipboard.writeText(tsvData);
            showSuccessMessage('Table copied as text for Excel.');
          }
        } catch (clipboardError) {
          // Final fallback
          const textArea = document.createElement('textarea');
          textArea.value = tsvData;
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
          showSuccessMessage('Table copied as text for Excel.');
        }
        
      } catch (error) {
        console.error('Error copying table:', error);
        showErrorMessage('Failed to copy table. Please try again.');
      }
    }

    //#region [================== APPLICATION SHUTDOWN AND TAB MANAGEMENT ==================]
    /**
     * Application shutdown functionality with cross-tab coordination and automatic server shutdown.
     * 
     * Features:
     * - Manual quit via quit button with confirmation
     * - Automatic server shutdown when last tab is closed
     * - Cross-tab coordination to close all tabs when quit is triggered
     * - Tab registration/deregistration for server-side tracking
     * 
     * Browser close detection limitation:
     * When closing the last tab or entire browser, JavaScript events (beforeunload, unload, pagehide, visibilitychange)
     * do not fire reliably or at all due to browser security restrictions. This means the server may not
     * automatically shut down when the browser is closed abruptly. Users should use the "Quit Application"
     * button for clean shutdown, or manually stop the server with Ctrl+C if needed.
     */

    /**
     * Gracefully quit the application by closing the browser tab and stopping the server.
     * Provides confirmation dialog to prevent accidental shutdown.
     */
    async function quitApplication() {
      // Confirm before quitting
      const confirmQuit = confirm('Are you sure you want to quit the application?\n\nThis will stop the server and close all tabs.');
      
      if (!confirmQuit) {
        return;
      }

      // Set shutdown flag to bypass beforeunload confirmation
      isShuttingDown = true;

      try {
        // Disable the quit button to prevent multiple clicks
        const quitButton = document.getElementById('quitButton');
        if (quitButton) {
          quitButton.disabled = true;
          quitButton.textContent = 'Shutting down...';
        }
        
        // Send quit request to server FIRST (before any tabs close)
        const response = await fetch('/quit', { 
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          }
        });
        
        if (response.ok) {
          // AFTER server confirms shutdown, broadcast to other tabs
          try {
            const shutdownChannel = new BroadcastChannel('camunda-viewer-shutdown');
            shutdownChannel.postMessage({ type: 'shutdown', timestamp: Date.now() });
            shutdownChannel.close();
          } catch (error) {
            // Fallback to localStorage for older browsers
            localStorage.setItem('camunda-viewer-shutdown', Date.now().toString());
            setTimeout(() => {
              localStorage.removeItem('camunda-viewer-shutdown');
            }, 5000);
          }
          
          // Close this tab immediately (no delay, no alert)
          setTimeout(() => {
            try {
              window.close();
              setTimeout(() => {
                document.body.innerHTML = `
                  <div class="app-stopped-container">
                    <div class="app-stopped-content">
                      <h1 class="app-stopped-title">Application Stopped</h1>
                      <p class="app-stopped-text">The Camunda Viewer server has been stopped successfully.</p>
                      <p class="app-stopped-small">You can safely close this tab/window.</p>
                    </div>
                  </div>
                `;
              }, 1000);
            } catch (error) {
              // Browser may prevent window.close() in some cases
            }
          }, 100);
        } else {
          throw new Error('Failed to send quit request');
        }
      } catch (error) {
        console.error('Error quitting application:', error);
        showErrorMessage('Failed to quit application properly. You may need to stop the server manually (Ctrl+C in command line).');
        
        // Re-enable the quit button on error
        const quitButton = document.getElementById('quitButton');
        if (quitButton) {
          quitButton.disabled = false;
          quitButton.textContent = 'Quit Application';
        }
      }
    }

    /**
     * Register this tab with the server for tracking
     */
    async function registerTab() {
      try {
        console.log(`📱 Registering tab: ${tabId}`);
        const response = await fetch('/register-tab', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ tabId: tabId })
        });
        
        if (response.ok) {
          const data = await response.json();
          console.log(`📱 Tab registered successfully: ${tabId} (total: ${data.totalTabs})`);
        }
      } catch (error) {
        console.warn('⚠️ Failed to register tab:', error);
      }
    }

    /**
     * Deregister this tab from the server.
     * The server will automatically shutdown if this is the last tab.
     */
    async function deregisterTab() {
      try {
        const response = await fetch('/deregister-tab', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ tabId: tabId })
        });
        
        if (response.ok) {
          const data = await response.json();
        }
      } catch (error) {
        console.warn('⚠️ Failed to deregister tab:', error);
      }
    }

    /**
     * Setup cross-tab shutdown coordination.
     * Listens for shutdown broadcasts from other tabs and handles automatic tab closure.
     */
    function setupShutdownListeners() {
      try {
        // Use BroadcastChannel API for modern browsers
        const shutdownChannel = new BroadcastChannel('camunda-viewer-shutdown');
        shutdownChannel.addEventListener('message', function(event) {
          if (event.data.type === 'shutdown') {
            // Set shutdown flag to bypass beforeunload confirmation
            isShuttingDown = true;
            // Close this tab immediately without confirmation
            setTimeout(() => {
              window.close();
              // Fallback if window.close() doesn't work
              setTimeout(() => {
                document.body.innerHTML = `
                  <div class="app-stopped-container">
                    <div class="app-stopped-content">
                      <h1 class="app-stopped-title">Application Stopped</h1>
                      <p class="app-stopped-text">This tab was closed automatically when the application was shut down from another tab.</p>
                      <p class="app-stopped-small">You can safely close this window.</p>
                    </div>
                  </div>
                `;
              }, 500);
            }, 100);
          }
        });

      } catch (error) {
        // Fallback to localStorage for older browsers
        let lastShutdownTime = 0;
        setInterval(() => {
          const shutdownTime = localStorage.getItem('camunda-viewer-shutdown');
          if (shutdownTime && parseInt(shutdownTime) > lastShutdownTime) {
            lastShutdownTime = parseInt(shutdownTime);
            // Set shutdown flag to bypass beforeunload confirmation
            isShuttingDown = true;
            setTimeout(() => {
              window.close();
              setTimeout(() => {
                document.body.innerHTML = `
                  <div class="app-stopped-container">
                    <div class="app-stopped-content">
                      <h1 class="app-stopped-title">Application Stopped</h1>
                      <p class="app-stopped-text">This tab was closed automatically when the application was shut down from another tab.</p>
                      <p class="app-stopped-small">You can safely close this window.</p>
                    </div>
                  </div>
                `;
              }, 500);
            }, 100);
          }
        }, 1000);
      }
    }

    //#region [================== VARIABLE VIEW FUNCTIONS ==================]
    /**
     * Functions for loading and displaying process variables in an interactive format.
     * Provides collapsible display for large objects and filtering by process instance.
     */
    
    /**
     * Load and display process variables for a specific process instance.
     * Fetches variables from the server and renders them with interactive controls.
     * @param {string} processKey - The key identifier of the process definition
     * @param {string} processInstanceId - The ID of the specific process instance
     */
    function loadVariableView(processKey, processInstanceId) {
      const headerElement = getCurrentDiagram();
      headerElement.textContent = `Loading Variables: ${processKey} - ${processInstanceId}`;
      
      // Clear current viewer since we're not displaying a diagram
      if (currentViewer) {
        currentViewer.destroy();
        currentViewer = null;
      }
      
      // Fetch variables from the server
      fetch(addSessionParam('/process-variables'))
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          return response.json();
        })
        .then(data => {
          const allVariables = data.variables || data; // Handle both {variables: [...]} and [...] formats
          
          // Filter variables for this specific process instance
          const processVariables = allVariables.filter(variable => 
            variable.processInstanceId === processInstanceId
          );
          
          if (processVariables.length === 0) {
            displayVariableContent('No variables found for this process instance.', processKey, processInstanceId);
            return;
          }
          
          // Group variables by name and create display content
          const variableGroups = {};
          processVariables.forEach(variable => {
            if (!variableGroups[variable.name]) {
              variableGroups[variable.name] = {
                name: variable.name,
                type: variable.type,
                value: variable.value,
                scope: variable.activityInstanceId ? 'Activity' : 'Process',
                processInstanceId: variable.processInstanceId, // Process instance that owns this variable
                processKey: variable.processDefinitionKey || processKey // Use the variable's process key or fall back to the current one
              };
            }
          });
          
          displayVariableContent(variableGroups, processKey, processInstanceId);
        })
        .catch(error => {
          console.error('Error loading variables:', error);
          const headerElement = getCurrentDiagram();
          headerElement.textContent = `Error loading variables: ${processKey} - ${processInstanceId}`;
          displayVariableContent('Failed to load variables. Please try again.', processKey, processInstanceId);
        });
    }

    /**
     * Display process variables in the canvas area with interactive formatting.
     * Creates expandable sections for complex objects and Java serialized data.
     * @param {Array} variables - Array of variable objects with name, value, type, and scope
     * @param {string} processKey - The key identifier of the process definition
     * @param {string} processInstanceId - The ID of the specific process instance
     */
    function displayVariableContent(variables, processKey, processInstanceId) {
      const canvas = getCanvas();
      
      // Hide zoom controls for Variable View since they don't apply to variable content
      hideZoomControls();
      
      // Create main container
      const containerDiv = document.createElement('div');
      containerDiv.className = 'monospace-container';
      
      if (typeof variables === 'string') {
        // Error message case
        containerDiv.innerHTML = `
          <div class="status-message">
            ${variables}
          </div>
        `;
      } else {
        // Variables display case
        let htmlContent = `
          <div class="process-variables-header">
            <h2 class="process-variables-title">Camunda Process Variables & Nulls</h2>
            <div class="process-variables-info">
              <strong>Process:</strong> ${processKey}<br>
              <strong>Instance ID:</strong> ${processInstanceId}<br>
              <strong>Variable Count:</strong> ${Object.keys(variables).length}
            </div>
          </div>
        `;
        
        // Create variable display (exclude Java objects)
        for (const [varName, varData] of Object.entries(variables)) {
          // Skip Java serialized objects - they belong in the New Variables section
          if (varData.type === 'Object' && typeof varData.value === 'string' && varData.value.length > 0) {
            continue; // Skip Java objects in regular Variables View
          }
          
          const variableHtml = createVariableDisplay(varName, varData.value, varData.type, varData.scope, varData.processKey, varData.processInstanceId, false);
          htmlContent += variableHtml;
        }
        
        containerDiv.innerHTML = htmlContent;
        
        // Add click handlers for collapsible content
        setupCollapsibleHandlers(containerDiv);
      }
      
      canvas.innerHTML = '';
      canvas.appendChild(containerDiv);
    }

    //#region [================== VARIABLE DISPLAY HELPERS ==================]
    /**
     * Shared helper functions for building collapsible variable content.
     * Used by both createVariableDisplay and createExecutionVariableDisplay.
     */
    
    // Helper to create collapsible Java serialized object content
    function createJavaSerializedContent(name, processKey, processInstanceId, isExecution = false) {
      const containerId = generateDeserializedContainerId(name, processKey, processInstanceId, isExecution);
      
      const processKeyParam = isExecution ? 'execution' : processKey;
      
      return `
        <div class="java-serialized-variable collapsible-header-warning" 
             onclick="toggleJavaContent(this, '${escapeHtml(name)}', '${escapeHtml(processKeyParam)}', '${escapeHtml(processInstanceId)}')">
          ☕ Java Object - Click to expand
        </div>
        <div class="collapsible-content${isExecution ? ' collapsible-content-orange' : ''} collapsible-collapsed">
          <div id="${containerId}" class="${isExecution ? 'margin-small' : 'java-execution-content'}">
            <!-- Deserialized content will be loaded here -->
          </div>
        </div>
      `;
    }
    
    // Helper to create collapsible object content
    function createCollapsibleObject(value, headerClass = 'collapsible-header clickable-link', contentClass = 'collapsible-content collapsible-content-static') {
      const jsonStr = JSON.stringify(value, null, 2);
      const lines = jsonStr.split('\n');
      
      if (lines.length > 10 || jsonStr.length > 200) {
        return `
          <div class="${headerClass}">
            {Object} - Click to expand (${Object.keys(value).length} properties)
          </div>
          <div class="${contentClass}">
            <pre class="pre-wrap">${escapeHtml(jsonStr)}</pre>
          </div>
        `;
      } else {
        return `<pre class="pre-wrap">${escapeHtml(jsonStr)}</pre>`;
      }
    }
    
    // Helper to create collapsible string content
    function createCollapsibleString(value, isExecution = false) {
      const headerClass = isExecution ? 'collapsible-header clickable-link' : 'collapsible-header';
      const contentClass = isExecution ? 'collapsible-content collapsible-content-static' : 'collapsible-content';
      
      if (value.length > 100) {
        return `
          <div class="${headerClass}">
            "${value.substring(0, 50)}..." - Click to expand (${value.length} chars)
          </div>
          <div class="${contentClass}">
            <pre class="${isExecution ? 'pre-wrap' : 'pre-content'}">"${escapeHtml(value)}"</pre>
          </div>
        `;
      } else {
        const spanClass = isExecution ? 'text-string' : 'value-string';
        return `<span class="${spanClass}">"${escapeHtml(value)}"</span>`;
      }
    }
    
    // Helper to create badge HTML
    function createBadgeHtml(scope, type, extraBadges = '') {
      const scopeClass = scope.toLowerCase() === 'global' ? 'orange' : 
                        scope.toLowerCase() === 'local' ? 'blue' : 
                        scope.toLowerCase() === 'process' ? 'green' : 'grey';
      
      return `
        <span class="badge badge-${scopeClass}">${scope}</span>
        <span class="badge badge-slate">${type}</span>
        ${extraBadges}
      `;
    }
    //#endregion

    /**
     * Create a formatted HTML display for a single process variable.
     * Handles different data types with appropriate rendering and controls.
     * @param {string} name - The variable name
     * @param {*} value - The variable value (any type)
     * @param {string} type - The variable type (e.g., String, Object, Serializable)
     * @param {string} scope - The variable scope (e.g., local, global)
     * @param {string} processKey - The process definition key (optional)
     * @param {string} processInstanceId - The process instance ID (optional)
     * @param {boolean} showJavaObjects - Whether to show expandable Java object controls
     * @returns {string} HTML string for the variable display
     */
    function createVariableDisplay(name, value, type, scope, processKey = '', processInstanceId = '', showJavaObjects = false) {
      // Handle undefined scope and type with default values
      scope = scope || 'unknown';
      type = type || 'unknown';
      
      let valueDisplay = '';
      let deserializationInfo = '';
      
      // Check if this is a Java serialized object
      if (type === 'Object' && typeof value === 'string' && value.length > 0) {
        if (!showJavaObjects) {
          return ''; // This should not appear in regular Variables View
        }
        
        // This is a Java serialized object that needs deserialization
        deserializationInfo = `
          <div class="warning-info-small">
            <div class="warning-info-text">
              ☕ <strong>Java Serialized Object</strong> - Click below to deserialize and view
            </div>
          </div>
        `;
        
        valueDisplay = createJavaSerializedContent(name, processKey, processInstanceId, false);
      } else if (value === null || value === undefined) {
        valueDisplay = '<span class="null-value">null</span>';
      } else if (typeof value === 'object') {
        valueDisplay = createCollapsibleObject(value);
      } else if (typeof value === 'string') {
        valueDisplay = createCollapsibleString(value, false);
      } else {
        valueDisplay = `<span class="value-other">${escapeHtml(String(value))}</span>`;
      }
      
      return `
        <div class="variable-container">
          ${deserializationInfo}
          <div class="variable-header">
            <span class="variable-name">${escapeHtml(name)}</span>
            ${createBadgeHtml(scope, type, processKey ? `<span class="badge badge-purple">${processKey}</span>` : '')}
          </div>
          ${processInstanceId ? `<div class="instance-info">Instance: ${processInstanceId}</div>` : ''}
          <div class="variable-content">
            ${valueDisplay}
          </div>
        </div>
      `;
    }

    /**
     * Toggle the display of Java serialized content and trigger auto-deserialization.
     * Expands/collapses the content area and fetches deserialized data on first expand.
     * @param {HTMLElement} element - The clickable header element that triggers the toggle
     * @param {string} variableName - The name of the variable being toggled
     * @param {string} processKey - The process definition key
     * @param {string} processInstanceId - The process instance ID
     */
    function toggleJavaContent(element, variableName, processKey, processInstanceId) {
      const content = element.nextElementSibling;
      if (!content?.classList.contains('collapsible-content')) return;
      
      const isVisible = !content.classList.contains('collapsible-collapsed');
      
      if (isVisible) {
        // Hide
        content.classList.add('collapsible-collapsed');
        content.classList.remove('collapsible-expanded');
        element.innerHTML = '☕ Java Object - Click to expand';
      } else {
        // Show
        content.classList.remove('collapsible-collapsed');
        content.classList.add('collapsible-expanded');
        element.innerHTML = '☕ Java Object - Click to collapse';
        
        // Only deserialize if container is empty or has only the placeholder (first time)
        const containerId = generateDeserializedContainerId(variableName, processKey, processInstanceId);
        const container = document.getElementById(containerId);
        
        if (container && (container.innerHTML.trim() === '' || container.innerHTML.trim() === '<!-- Deserialized content will be loaded here -->')) {
          container.innerHTML = '<div class="auto-deserializing">⏳ Auto-deserializing...</div>';
          
          // Don't await - let it complete in background
          performDeserialization(variableName, processKey, processInstanceId)
            .then(result => {
              container.innerHTML = result.success ? 
                `<div class="deserialized-content"><strong>Object Type:</strong> ${escapeHtml(result.objectType || 'Unknown')}<br><strong>Value:</strong><br><pre class="java-content">${escapeHtml(JSON.stringify(result.value, null, 2))}</pre></div>` :
                `<div class="error-text">❌ Deserialization failed: ${escapeHtml(result.error || 'Unknown error')}</div>`;
            })
            .catch(error => {
              container.innerHTML = `<div class="error-text">❌ Auto-deserialization failed: ${escapeHtml(error.message)}</div>`;
            });
        }
        // If container already has content, just show it (no re-deserialization)
      }
    }

// Shared helper for deserializing variables without duplicating fetch logic
/**
 * Deserialize a Java variable by calling the server endpoint.
 * @param {string} variableName
 * @param {string} processKey
 * @param {string} processInstanceId
 * @returns {Promise<Object>} The deserialized result object
 */
async function performDeserialization(variableName, processKey, processInstanceId) {
  const url = addSessionParam(`/deserialize-variable`);
  const response = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ variableName, processKey, processInstanceId })
  });
  
  if (!response.ok) {
    const errText = await response.text();
    throw new Error(`HTTP error! status: ${response.status} - ${errText}`);
  }
  
  return response.json();
}

    /**
     * Display error message in a container with enhanced troubleshooting information
     */
    function displayDeserializationError(container, result, variableName, processKey, processInstanceId, isFromToggle = false) {
      const errorDetails = [];
      if (result.error) errorDetails.push(`Error: ${result.error}`);
      if (result.exitCode !== undefined) errorDetails.push(`Exit Code: ${result.exitCode}`);
      if (result.stderr) errorDetails.push(`StdErr: ${result.stderr}`);
      if (result.stdout) errorDetails.push(`StdOut: ${result.stdout}`);
      
      // If no detailed error info, provide generic troubleshooting
      if (errorDetails.length === 0 || (errorDetails.length === 1 && result.error === '')) {
        errorDetails.push('PowerShell deserialization failed with no error details');
        errorDetails.push('Check server logs for more information');
      }
      
      const troubleshootingTips = ['• Check server console for detailed PowerShell output',
                                   '• Verify PowerShell can execute scripts (Get-ExecutionPolicy)',
                                   '• Ensure Java runtime is available in PATH'];
      
      // Add specific troubleshooting for exit code 1
      if (result.exitCode === 1) {
        troubleshootingTips.unshift('Exit Code 1 typically indicates:',
                                   '• PowerShell execution policy restrictions',
                                   '• Missing Java deserialization dependencies',
                                   '• Invalid/corrupted serialized data',
                                   '• PowerShell script syntax errors');
      }
      
      container.innerHTML = `
        <div class="error-margin">
          ❌ Deserialization Failed
        </div>
        <div class="error-container-bg">
          <div><strong>Error Details:</strong> ${errorDetails.join(' | ')}</div>
          <hr class="separator-line">
          <div><strong>Variable:</strong> ${escapeHtml(variableName)}</div>
          <div><strong>Process:</strong> ${escapeHtml(processKey)}</div>
          <div><strong>Instance:</strong> ${escapeHtml(processInstanceId)}</div>
          <hr class="separator-line">
          <div><strong>Troubleshooting:</strong></div>
          <div class="variable-indent">
            ${troubleshootingTips.map(tip => `<div>${escapeHtml(tip)}</div>`).join('')}
          </div>
        </div>
      `;
    }

    /**
     * Display network/request error in a container
     */
    function displayRequestError(container, error, variableName, processKey, processInstanceId) {
      container.innerHTML = `
        <div class="error-margin">
          ❌ Request Failed
        </div>
        <div class="error-container-bg">
          <div><strong>Network/Request Error:</strong> ${escapeHtml(error.message)}</div>
          <hr class="separator-line">
          <div><strong>Variable:</strong> ${escapeHtml(variableName)}</div>
          <div><strong>Process:</strong> ${escapeHtml(processKey)}</div>
          <div><strong>Instance:</strong> ${escapeHtml(processInstanceId)}</div>
          <hr class="separator-line">
          <div><strong>Troubleshooting:</strong></div>
          <div class="variable-indent">
            <div>• Check network connection to server</div>
            <div>• Verify server is running and accessible</div>
            <div>• Check browser console for more details</div>
          </div>
        </div>
      `;
    }

    /**
     * Deserialize a Java serialized variable by calling the Camunda API
     */
    async function deserializeVariable(variableName, processKey, processInstanceId) {
      const button = event?.target;
      const originalText = button?.innerHTML;
      
      if (button) {
        button.innerHTML = '⏳ Loading...';
        button.disabled = true;
      }
      
      try {
        const result = await performDeserialization(variableName, processKey, processInstanceId);
        const containerId = generateDeserializedContainerId(variableName, processKey, processInstanceId);
        const container = document.getElementById(containerId);
        
        if (container) {
          if (result.success) {
            container.innerHTML = `
              <div class="success-margin">
                <strong>✅ Successfully Deserialized</strong><br>
                <span class="text-small">
                  Object Type: <code>${result.objectType || 'Unknown'}</code>
                </span>
              </div>
              <pre class="pre-formatted">${escapeHtml(JSON.stringify(result.value, null, 2))}</pre>
            `;
            container.style.display = 'block';
            
            if (button) {
              button.innerHTML = '✅ Deserialized';
              button.className = button.className.replace(/\bbg-\w+\b/g, '') + ' bg-success';
            }
          } else {
            displayDeserializationError(container, result, variableName, processKey, processInstanceId, false);
            container.style.display = 'block';
            
            if (button) {
              button.innerHTML = '❌ Failed';
              button.className = button.className.replace(/\bbg-\w+\b/g, '') + ' bg-error';
            }
          }
        }
      } catch (error) {
        const containerId = generateDeserializedContainerId(variableName, processKey, processInstanceId);
        const container = document.getElementById(containerId);
        
        if (container) {
          displayRequestError(container, error, variableName, processKey, processInstanceId);
          container.style.display = 'block';
        }
        
        if (button) {
          button.innerHTML = originalText || 'Deserialize';
          button.className = button.className.replace(/\bbg-\w+\b/g, '') + ' badge-orange';
          button.disabled = false;
        }
      }
    }

    function setupCollapsibleHandlers(container) {
      const headers = container.querySelectorAll('.collapsible-header');
      headers.forEach(header => {
        // Skip headers that have Java-specific onclick handlers (they handle their own toggle logic)
        if (header.onclick || header.getAttribute('onclick')) {
          return;
        }
        
        header.addEventListener('click', function() {
          const content = this.nextElementSibling;
          if (content && content.classList.contains('collapsible-content')) {
            // Use getComputedStyle for accurate visibility check
            const computedStyle = window.getComputedStyle(content);
            const isCurrentlyVisible = computedStyle.display !== 'none';
            
            if (!isCurrentlyVisible) {
              content.style.display = 'block';
              this.style.color = '#1976D2';
              this.innerHTML = this.innerHTML.replace('Click to expand', 'Click to collapse');
            } else {
              content.style.display = 'none';
              this.style.color = '#2196F3';
              this.innerHTML = this.innerHTML.replace('Click to collapse', 'Click to expand');
            }
          }
        });
      });
    }

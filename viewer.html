    //#region [================== EXECUTION VARIABLE VIEW FUNCTIONS ==================]
    /**
     * Functions for loading and displaying execution variables (local variables and variable history)
     * collected by the enhanced data collection process.
     */
    function loadExecutionVariableView(processKey, processInstanceId) {
      const headerElement = getCurrentDiagram();
      headerElement.textContent = `Loading Execution Variables: ${processKey} - ${processInstanceId}`;
      
      // Clear current viewer since we're not displaying a diagram
      if (currentViewer) {
        currentViewer.destroy();
        currentViewer = null;
      }
      
      // Construct filename for execution variables based on our GetData.ps1 naming convention
      const executionVarFileName = `${processKey}-${getBusinessKeyFromDisplay()}-${processInstanceId}-execution-variables.json`;
      
      // First check if we have any execution data files at all
      fetch(addSessionParam('/list-files?type=execution-variables'))
        .then(response => response.json())
        .then(files => {
          
          if (files.includes(executionVarFileName)) {
            // File exists, fetch it from execution data endpoint
            return fetch(addSessionParam(`/get-file/${executionVarFileName}`));
          } else {
            // File not found - throw our custom error
            throw new Error('EXECUTION_DATA_NOT_FOUND');
          }
        })
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          return response.json();
        })
        .then(data => {
          displayExecutionVariableContent(data, processKey, processInstanceId);
        })
        .catch(error => {
          const headerElement = getCurrentDiagram();
          headerElement.textContent = `Execution Variables: ${processKey} - ${processInstanceId}`;
          
          if (error.message === 'EXECUTION_DATA_NOT_FOUND') {
            displayExecutionVariableContent('EXECUTION_DATA_NOT_FOUND', processKey, processInstanceId);
          } else {
            displayExecutionVariableContent('ERROR_LOADING_DATA', processKey, processInstanceId);
          }
        });
    }

    function displayExecutionVariableContent(data, processKey, processInstanceId) {
      const canvas = getCanvas();
      
      // Hide zoom controls for Execution Variable View since they don't apply to variable content
      hideZoomControls();
      
      // Create main container
      const containerDiv = document.createElement('div');
      containerDiv.className = 'monospace-container';
      
      if (typeof data === 'string') {
        // Handle different error cases
        if (data === 'EXECUTION_DATA_NOT_FOUND') {
          // Instead of showing an error, load and display Java objects from regular variables
          loadJavaObjectsForNewVariablesView(processKey, processInstanceId, containerDiv);
        } else if (data === 'ERROR_LOADING_DATA') {
          containerDiv.innerHTML = `
            <div class="status-error-center">
              ❌ Failed to load execution variables. Please try again.
            </div>
          `;
        } else {
          // Fallback for unexpected string response
          containerDiv.innerHTML = `
            <div class="status-info-center">
              ${data}
            </div>
          `;
        }
      } else {
        // Execution variables display case
        const executionVariables = data.executionVariables || [];
        const variableHistory = data.variableHistory || [];
        const activityInstances = data.activityInstances || [];
        
        let htmlContent = `
          <div class="section-container">
            <h2 class="section-title">🔧 Execution Variables</h2>
            <div class="section-description">
              <strong>Process:</strong> ${processKey}<br>
              <strong>Instance ID:</strong> ${processInstanceId}<br>
              <strong>Collection Time:</strong> ${data.collectionTime || 'Unknown'}<br>
              <strong>Execution Variables:</strong> ${executionVariables.length}<br>
              <strong>Variable History Events:</strong> ${variableHistory.length}<br>
              <strong>Activity Instances:</strong> ${activityInstances.length}
            </div>
          </div>
        `;

        // Display execution variables section
        if (executionVariables.length > 0) {
          htmlContent += `
            <div class="section-container-large">
              <h3 class="section-title-variables">Local Execution Variables</h3>
              <div class="section-description-small">
                Variables scoped to specific execution contexts within the process instance.
              </div>
          `;
          
          // Group execution variables by execution ID
          const varsByExecution = {};
          executionVariables.forEach(variable => {
            const execId = variable.executionId;
            if (!varsByExecution[execId]) {
              varsByExecution[execId] = [];
            }
            varsByExecution[execId].push(variable);
          });
          
          Object.entries(varsByExecution).forEach(([executionId, variables]) => {
            const activityId = variables[0].activityId || 'Unknown';
            htmlContent += `
              <div class="summary-container">
                <h4 class="summary-title">
                  Execution: ${executionId}
                  ${activityId !== 'Unknown' ? `<span class="summary-info"> (Activity: ${activityId})</span>` : ''}
                </h4>
            `;
            
            variables.forEach(variable => {
              const variableHtml = createExecutionVariableDisplay(
                variable.variableName, 
                variable.variableValue, 
                variable.variableType, 
                variable.scope, 
                variable.executionId, 
                variable.activityId
              );
              htmlContent += variableHtml;
            });
            
            htmlContent += '</div>';
          });
          
          htmlContent += '</div>';
        }

        // Display variable history section
        if (variableHistory.length > 0) {
          htmlContent += `
            <div class="section-container-large">
              <h3 class="section-title-history">Variable Change History</h3>
              <div class="section-description-small">
                Chronological history of variable updates throughout process execution.
              </div>
          `;
          
          // Sort variable history by time
          const sortedHistory = variableHistory.sort((a, b) => new Date(a.time) - new Date(b.time));
          
          sortedHistory.forEach((historyItem, index) => {
            const timeDisplay = new Date(historyItem.time).toLocaleString();
            htmlContent += `
              <div class="history-item">
                <div class="history-item-info">
                  ${timeDisplay} | ${historyItem.operation || 'UPDATE'} | 
                  ${historyItem.executionId ? `Execution: ${historyItem.executionId}` : ''} 
                  ${historyItem.activityInstanceId ? `| Activity: ${historyItem.activityInstanceId}` : ''}
                </div>
                ${createExecutionVariableDisplay(
                  historyItem.variableName, 
                  historyItem.value, 
                  historyItem.variableType, 
                  'history', 
                  historyItem.executionId, 
                  historyItem.activityInstanceId
                )}
              </div>
            `;
          });
          
          htmlContent += '</div>';
        }

        // Display activity instances section (summary)
        if (activityInstances.length > 0) {
          htmlContent += `
            <div class="section-container-large">
              <h3 class="section-title-summary">Activity Instance Summary</h3>
              <div class="section-description-small">
                Summary of activity instances with execution details.
              </div>
              <div class="summary-background">
                <strong>Total Activity Instances:</strong> ${activityInstances.length}<br>
                <strong>Activity Types:</strong> ${[...new Set(activityInstances.map(a => a.activityType))].join(', ')}<br>
                <strong>Start Time Range:</strong> ${activityInstances.length > 0 ? 
                  `${new Date(Math.min(...activityInstances.map(a => new Date(a.startTime)))).toLocaleString()} - 
                   ${new Date(Math.max(...activityInstances.map(a => new Date(a.endTime || a.startTime)))).toLocaleString()}` : 'N/A'}
              </div>
            </div>
          `;
        }

        // If no data at all
        if (executionVariables.length === 0 && variableHistory.length === 0 && activityInstances.length === 0) {
          htmlContent += `
            <div class="status-info-center">
              No execution variables or variable history found for this process instance.<br>
              <span class="status-text-small">
                This data is collected by the enhanced execution variable collection process in GetData.ps1.
              </span>
            </div>
          `;
        }
        
        containerDiv.innerHTML = htmlContent;
        
        // Add click handlers for collapsible content
        setupCollapsibleHandlers(containerDiv);
      }
      
      canvas.innerHTML = '';
      canvas.appendChild(containerDiv);
    }

    // Function to load and display Java objects when execution data is not available
    async function loadJavaObjectsForNewVariablesView(processKey, processInstanceId, containerDiv) {
      try {
        // Fetch regular variables to extract Java objects
        const response = await fetch(addSessionParam('/process-variables'));
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const data = await response.json();
        const variables = data.variables || [];
        
        // Filter only Java objects
        const javaObjects = {};
        for (const varData of variables) {
          if (varData.type === 'Object' && typeof varData.value === 'string' && varData.value.length > 0) {
            javaObjects[varData.name] = varData;
          }
        }
        
        let htmlContent = `
          <div class="section-container">
            <h2 class="section-title-java">☕ Java Serialized Objects</h2>
            <div class="section-description">
              <strong>Process:</strong> ${processKey}<br>
              <strong>Instance ID:</strong> ${processInstanceId}<br>
              <strong>Java Objects Found:</strong> ${Object.keys(javaObjects).length}
            </div>
            <div class="warning-info">
              <div class="warning-info-text-only">
                ℹ️ <strong>Note:</strong> These are Java serialized objects that require deserialization to view their contents. 
                Click on any object below to deserialize and inspect its data.
              </div>
            </div>
          </div>
        `;
        
        if (Object.keys(javaObjects).length > 0) {
          // Display Java objects
          for (const [varName, varData] of Object.entries(javaObjects)) {
            const variableHtml = createVariableDisplay(varName, varData.value, varData.type, varData.scope, varData.processKey, varData.processInstanceId, true);
            htmlContent += variableHtml;
          }
        } else {
          htmlContent += `
            <div class="status-info-center">
              No Java serialized objects found in this process instance.
            </div>
          `;
        }
        
        containerDiv.innerHTML = htmlContent;
        
        // Add click handlers for collapsible content and Java deserialization
        setupCollapsibleHandlers(containerDiv);
        
      } catch (error) {
        console.error('Error loading Java objects:', error);
        containerDiv.innerHTML = `
          <div class="status-error-center">
            ❌ Failed to load Java objects. Please try again.
          </div>
        `;
      }
      
      const canvas = getCanvas();
      canvas.innerHTML = '';
      canvas.appendChild(containerDiv);
    }

    function createExecutionVariableDisplay(name, value, type, scope, executionId = '', activityId = '') {
      let valueDisplay = '';
      
      // CHECK FOR JAVA SERIALIZED DATA IN STRING VALUES
      // Java serialization signature: rO0ABX (base64 encoded java serialization header)
      if (typeof value === 'string' && value.startsWith('rO0ABX')) {
        valueDisplay = createJavaSerializedContent(name, 'execution', executionId, true);
      }
      // Handle different value types
      else if (value === null || value === undefined) {
        valueDisplay = '<span class="text-muted">null</span>';
      } else if (typeof value === 'object') {
        valueDisplay = createCollapsibleObject(value, 'collapsible-header clickable-link', 'collapsible-content collapsible-content-static');
      } else if (typeof value === 'string') {
        valueDisplay = createCollapsibleString(value, true);
      } else {
        valueDisplay = `<span class="text-primary">${String(value)}</span>`;
      }
      
      return `
        <div class="variable-list-container">
          <div class="variable-list-header">
            <strong class="variable-list-name">${escapeHtml(name)}</strong>
            <span class="variable-list-scope-${scope.toLowerCase()}">${scope.toUpperCase()}</span>
            <span class="variable-list-type">${type || 'unknown'}</span>
            ${executionId ? `<span class="execution-badge">Exec: ${executionId.substring(0, 8)}...</span>` : ''}
          </div>
          <div class="variable-list-content">
            ${valueDisplay}
          </div>
        </div>
      `;
    }

    function getBusinessKeyFromDisplay() {
      const claimDisplay = document.querySelector('.business-key-display');
      if (claimDisplay && claimDisplay.textContent) {
        return claimDisplay.textContent.replace('Business Key: ', '').trim();
      }
      
      // Fallback to input field
      const claimInput = getBusinessKeyInput();
      return claimInput ? claimInput.value.trim() : '';
    }
    //#endregion

    //#region [================== CLAIM HISTORY MANAGEMENT ==================]
    /**
     * Functions for managing Business Key history and auto-completion features.
     * Stores recent Business Keys per environment for quick access and re-execution.
     */
    async function loadProcessHistory() {
      try {
        const response = await fetch(addSessionParam('/process-history'));
        const data = await response.json();
        
        // Set selected environment (use exact value from claim history)
        const environmentSelect = getEnvironmentSelect();
        if (data.selected && environmentSelect) {
          // Use exact environment name from claim history (matches config filename)
          // Wait a bit for the config files to load first
          setTimeout(() => {
            environmentSelect.value = data.selected;
          }, 100);
        }
        
        // Populate Business Key dropdown for current environment
        setTimeout(() => {
          updateProcessHistoryDropdown(data);
          // Also populate the input field with most recent claim for current environment
          populateInputFromHistory(data);
        }, 200);
        
        return data;
      } catch (error) {
        console.error('Error loading claim history:', error);
        return null;
      }
    }
    
    /**
     * Restore the current Business Key from server memory on page refresh.
     * This maintains the Business Key header display when the user refreshes the page.
     */
    async function restoreCurrentBusinessKey() {
      try {
        const response = await fetch(addSessionParam('/current-process'));
        const data = await response.json();
        
        if (data.businessKey) {
          updateBusinessKeyDisplay(data.businessKey);
        }
      } catch (error) {
        console.error('Error restoring current Business Key:', error);
      }
    }
    
    function populateInputFromHistory(historyData) {
      const businessKeyInput = getBusinessKeyInput();
      const environmentSelect = getEnvironmentSelect();
      
      if (!historyData || !businessKeyInput || !environmentSelect) {
        return;
      }
      
      // Never auto-populate the input - only set placeholder and button state
      const currentValue = businessKeyInput.value.trim();
      const currentEnv = environmentSelect.value || 'local';
      const envHistory = historyData.environments[currentEnv] || [];
      
      if (envHistory.length > 0) {
        // Set placeholder text
        if (!currentValue) {
          businessKeyInput.placeholder = 'Select from history or enter new Business Key';
          
          // Disable button since input is empty
          const button = getProcessButton();
          if (button) {
            button.disabled = true;
          }
        }
      } else {
        // No history for this environment - set default placeholder
        if (!currentValue) {
          businessKeyInput.placeholder = 'Enter Business Key';
          
          // Disable button since we have no Business Key
          const button = getProcessButton();
          if (button) {
            button.disabled = true;
          }
        }
      }
    }

    function updateProcessHistoryDropdown(historyData) {
      // Store the history data globally for autocomplete
      window.currentHistoryData = historyData;
    }

    function showAutocomplete(filter = '') {
      const historyDropdown = getHistoryDropdown();
      const environmentSelect = getEnvironmentSelect();
      
      if (!window.currentHistoryData || !environmentSelect) {
        historyDropdown.style.display = 'none';
        return;
      }
      
      // Use exact environment value from dropdown (matches config filename)
      const currentEnv = environmentSelect.value;
      const envHistory = window.currentHistoryData.environments[currentEnv] || [];
      
      // Filter history based on current input
      const filteredHistory = envHistory.filter(businessKey => 
        businessKey.includes(filter) || filter === ''
      );
      
      // Clear and rebuild dropdown
      historyDropdown.innerHTML = '';
      
      if (filteredHistory.length === 0) {
        historyDropdown.style.display = 'none';
        return;
      }
      
      filteredHistory.forEach(businessKey => {
        const div = document.createElement('div');
        div.className = 'claim-history-item';
        div.textContent = businessKey;
        
        // Highlight matching text if there's a filter
        if (filter) {
          const highlightedText = businessKey.replace(
            new RegExp(filter, 'gi'), 
            `<strong class="highlighted-text">$&</strong>`
          );
          div.innerHTML = highlightedText;
        }
        
        div.onclick = function() {
          const input = getBusinessKeyInput();
          const button = getProcessButton();
          input.value = businessKey;
          hideAutocomplete();
          
          // Trigger validation and enable button only if not currently fetching
          if (!isFetching) {
            input.classList.remove('invalid');
            button.disabled = false;
            getValidationMessage().textContent = '';
          }
          
          input.focus();
        };
        
        div.onmouseover = function() { 
          this.style.backgroundColor = '#f8f9fa'; 
        };
        div.onmouseout = function() { 
          this.style.backgroundColor = 'white'; 
        };
        
        historyDropdown.appendChild(div);
      });
      
      historyDropdown.style.display = 'block';
    }

    function hideAutocomplete() {
      const historyDropdown = getHistoryDropdown();
      historyDropdown.style.display = 'none';
    }

    // Handle dropdown/input switching
    function setupBusinessKeyControls() {
      const businessKeyInput = getBusinessKeyInput();
      const environmentSelect = getEnvironmentSelect();
      const historyDropdown = getHistoryDropdown();
      
      if (businessKeyInput) {
        // Show autocomplete when input gets focus
        businessKeyInput.addEventListener('focus', function() {
          showAutocomplete(this.value);
        });
        
        // Update autocomplete as user types
        businessKeyInput.addEventListener('input', function() {
          showAutocomplete(this.value);
        });
        
        // Handle keyboard navigation
        businessKeyInput.addEventListener('keydown', function(e) {
          const items = historyDropdown.querySelectorAll('div');
          let selectedIndex = -1;
          
          // Find currently selected item
          for (let i = 0; i < items.length; i++) {
            if (items[i].style.backgroundColor === 'rgb(232, 240, 254)') {
              selectedIndex = i;
              break;
            }
          }
          
          if (e.key === 'ArrowDown') {
            e.preventDefault();
            // Clear previous selection
            items.forEach(item => item.style.backgroundColor = 'white');
            
            // Select next item
            selectedIndex = Math.min(selectedIndex + 1, items.length - 1);
            if (items[selectedIndex]) {
              items[selectedIndex].style.backgroundColor = '#e8f0fe';
            }
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            // Clear previous selection
            items.forEach(item => item.style.backgroundColor = 'white');
            
            // Select previous item
            selectedIndex = Math.max(selectedIndex - 1, 0);
            if (items[selectedIndex]) {
              items[selectedIndex].style.backgroundColor = '#e8f0fe';
            }
          } else if (e.key === 'Enter' && selectedIndex >= 0) {
            e.preventDefault();
            // Use selected item
            this.value = items[selectedIndex].textContent;
            hideAutocomplete();
          } else if (e.key === 'Escape') {
            hideAutocomplete();
          }
        });
      }
      
      // Hide autocomplete when clicking outside
      document.addEventListener('click', function(event) {
        if (!businessKeyInput.contains(event.target) && !historyDropdown.contains(event.target)) {
          hideAutocomplete();
        }
      });
      
      // When environment changes, update claim history
      if (environmentSelect) {
        environmentSelect.addEventListener('change', async function() {
          // Clear the Business Key textbox when environment changes
          const claimInput = getBusinessKeyInput();
          if (claimInput) {
            claimInput.value = '';
            // Clear any validation messages
            const validationMessage = getValidationMessage();
            if (validationMessage) {
              validationMessage.textContent = '';
            }
            // Remove invalid styling
            claimInput.classList.remove('invalid');
          }
          
          // Save the selected environment using exact value from dropdown
          const environment = this.value;
          
          try {
            await fetch(addSessionParam('/process-history'), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ 
                environment: environment,
                businessKey: 'dummy' // Just to trigger environment save
              })
            });
          } catch (error) {
            console.error('Error saving environment:', error);
          }
          
          // Clear the input field to show available choices
          const businessKeyInput = getBusinessKeyInput();
          const claimButton = getProcessButton();
          if (businessKeyInput) {
            businessKeyInput.value = '';
            businessKeyInput.placeholder = 'Select from history or enter new Business Key';
            // Focus the input to show cursor and make it ready for interaction
            setTimeout(() => businessKeyInput.focus(), 100);
          }
          
          // Enable button since empty input is allowed (can use current claim)
          if (claimButton) {
            claimButton.disabled = false;
          }
          
          // Update the history data for the NEW environment without resetting environment selection
          try {
            const response = await fetch(addSessionParam('/process-history'));
            const historyData = await response.json();
            if (historyData) {
              updateProcessHistoryDropdown(historyData);
              
              // Show autocomplete to display available choices after input is focused
              setTimeout(() => showAutocomplete(''), 150);
            }
          } catch (error) {
            console.error('Error loading history for new environment:', error);
          }
        });
      }
    }

    async function saveProcessToHistory(environment, businessKey) {
      if (!environment || !businessKey) return;
      
      try {
        const response = await fetch(addSessionParam('/process-history'), {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            environment: environment, // Use exact environment name
            businessKey: businessKey
          })
        });
        
        if (response.ok) {
          const data = await response.json();
          if (data.history) {
            updateProcessHistoryDropdown(data.history);
          }
        }
      } catch (error) {
        console.error('Error saving claim to history:', error);
      }
    }
    //#endregion

    //#region [================== UTILITY FUNCTIONS ==================]
    /**
     * Helper function to display error messages with consistent styling
     */
    // =================================================================
    // Standardized Message System
    // =================================================================
    
    /**
     * Shows an error message with consistent styling
     */
    function showErrorMessage(message, includeProgressCounter = false, counterText = '') {
      showMessage(message, 'error', includeProgressCounter, counterText);
    }
    
    /**
     * Shows a success message with consistent styling
     */
    function showSuccessMessage(message, includeProgressCounter = false, counterText = '') {
      showMessage(message, 'success', includeProgressCounter, counterText);
    }
    
    /**
     * Shows a warning message with consistent styling
     */
    function showWarningMessage(message, includeProgressCounter = false, counterText = '') {
      showMessage(message, 'warning', includeProgressCounter, counterText);
    }
    
    /**
     * Shows an info message with consistent styling
     */
    function showInfoMessage(message, includeProgressCounter = false, counterText = '') {
      showMessage(message, 'info', includeProgressCounter, counterText);
    }
    
    /**
     * Core message display function with standardized styling
     */
    function showMessage(message, type = 'info', includeProgressCounter = false, counterText = '') {
      const progressMessage = getProgressMessage();
      
      if (includeProgressCounter && counterText) {
        const progressCounter = getProgressCounter();
        progressCounter.textContent = counterText;
      }
      
      // Message type styling
      const styles = {
        error: { color: '#d32f2f', icon: '❌', cssClass: 'message-error' },
        success: { color: '#2e7d32', icon: '✅', cssClass: 'message-success' },
        warning: { color: '#f57c00', icon: '⚠️', cssClass: 'message-warning' },
        info: { color: '#1976d2', icon: 'ℹ️', cssClass: 'message-info' }
      };
      
      const style = styles[type] || styles.info;
      
      // Clear previous message type classes
      progressMessage.className = progressMessage.className.replace(/message-(error|success|warning|info)/g, '');
      
      progressMessage.style.display = 'block';
      progressMessage.style.color = style.color;
      progressMessage.style.fontWeight = 'bold';
      progressMessage.classList.add(style.cssClass);
      progressMessage.textContent = `${style.icon} ${message}`;
    }
    
    /**
     * Hides any currently displayed message
     */
    function hideMessage() {
      const progressMessage = getProgressMessage();
      progressMessage.style.display = 'none';
      progressMessage.textContent = '';
      // Clear any message type classes
      progressMessage.className = progressMessage.className.replace(/message-(error|success|warning|info)/g, '');
    }

    /**
     * Helper functions for accessing DOM elements by their IDs.
     * These functions provide clean access to UI elements throughout the application.
     */
    function getEnvironmentSelect() {
      return document.getElementById('environmentSelect');
    }

    function getBusinessKeyInput() {
      return document.getElementById('businessKeyInput');
    }

    function getMaxRunsInput() {
      return document.getElementById('maxRunsInput');
    }

    function getProcessButton() {
      return document.getElementById('getProcessButton');
    }

    /**
     * Enable or disable the claim fetching UI controls to prevent concurrent operations.
     * @param {boolean} enabled - Whether to enable (true) or disable (false) the controls
     */
    function setProcessFetchingUIState(enabled) {
      const businessKeyInput = getBusinessKeyInput();
      const environmentSelect = getEnvironmentSelect();
      const maxRunsInput = getMaxRunsInput();
      const button = getProcessButton();
      
      if (businessKeyInput) businessKeyInput.disabled = !enabled;
      if (environmentSelect) environmentSelect.disabled = !enabled;
      if (maxRunsInput) maxRunsInput.disabled = !enabled;
      if (button) button.disabled = !enabled;
    }

    function getProgressCounter() {
      return document.getElementById('progressCounter');
    }

    function getProgressMessage() {
      return document.getElementById('progressMessage');
    }

    function getValidationMessage() {
      return document.getElementById('validationMessage');
    }

    function getFileList() {
      return document.getElementById('fileList');
    }

    function getCanvas() {
      return document.getElementById('canvas');
    }

    function getCurrentDiagram() {
      return document.getElementById('currentDiagram');
    }

    function getLogActions() {
      return document.getElementById('logActions');
    }

    function getHistoryDropdown() {
      return document.getElementById('historyDropdown');
    }

    function getBusinessKeyDisplay() {
      return document.getElementById('businessKeyDisplay');
    }

    /**
     * Update the Business Key display in the header
     */
    function updateBusinessKeyDisplay(businessKey) {
      const businessKeyDisplay = getBusinessKeyDisplay();
      if (businessKey) {
        businessKeyDisplay.textContent = `Business Key: ${businessKey}`;
        businessKeyDisplay.style.display = 'block';
      } else {
        businessKeyDisplay.style.display = 'none';
      }
    }
    //#endregion
  </script>

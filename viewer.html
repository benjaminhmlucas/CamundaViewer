<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Camunda Diagram Viewer</title>
  <link rel="stylesheet" href="/viewer.css">
  <style>

  </style>
</head>
<body>
  <!--#region [================== LEFT PANEL ==================]-->
  <div id="leftPanel">
    <!-- Action Buttons - Positioned at the top -->
    <div class="quit-section">
      <button id="quitButton" class="quit-button" onclick="quitApplication()" title="Stop server and close application">
        <div class="button-container">
          <img src="/images/exit-door.png" alt="Exit" class="exit-icon" onerror="this.style.display='none'; this.nextSibling.style.display='inline';">
          <span class="hidden">Exit</span>
          <span class="text-with-margin">Quit Application</span>
        </div>
      </button>
      <button id="newTabButton" class="new-tab-button" onclick="openNewClaimTab()" title="Open a new claim tab">
        <div class="button-container-with-margin">
          ➕ New Tab
        </div>
      </button>
    </div>
    
    <!--#region [================== Business Key INPUT SECTION ==================]-->
    <!-- Business Key Input Section -->
    <div class="process-input-section">
      <div class="menu-title menu-title-bordered">🔍 Search By Business Key</div>
      <div class="input-group">
        <div class="input-container-relative">
          <input type="text" id="businessKeyInput" placeholder="Enter Business Key" maxlength="20" class="input-full-width" autocomplete="off">
          <div id="historyDropdown" class="history-dropdown">
          </div>
        </div>
        <button id="getProcessButton" onclick="fetchProcessData()">Get Process</button>
      </div>
      <div class="input-group input-group-with-margin">
        <div class="flex-gap">
          <div class="flex-full">
            <label for="environmentSelect" class="form-label">Environment:</label>
            <select id="environmentSelect" class="input-full-width">
              <option value="local">Loading...</option>
            </select>
          </div>
          <div class="flex-fixed">
            <label for="maxRunsInput" class="form-label">Max Runs:</label>
            <input type="number" id="maxRunsInput" min="1" max="50" value="5" class="input-full-width" title="Maximum number of runs to process (1-50)">
          </div>
        </div>
      </div>
      <div id="validationMessage" class="validation-message"></div>
      <div id="progressCounter" class="progress-counter"></div>
      <div id="progressMessage" class="progress-message"></div>
      <div id="logActions" class="log-actions hidden">
        <button id="copyLogButton" class="log-button" onclick="copyLogToClipboard()">📋 Copy Log</button>
        <button id="openLogButton" class="log-button" onclick="viewSessionLog()">📄 View Log</button>
      </div>
    </div>
    <!--#endregion-->
    
    <!--#region [================== PROCESS TIMELINE SECTION ==================]-->
    <div class="menu-title">📋 Process Execution Timeline</div>
    
    <div id="fileList">Loading diagrams...</div>
    <!--#endregion-->
  </div>
  <!--#endregion-->
  
  <!--#region [================== SPLITTER ==================]-->
  <div id="splitter"></div>
  <!--#endregion-->
  
  <!--#region [================== RIGHT PANEL ==================]-->
  <div id="rightPanel">
    <!--#region [================== HEADER SECTION ==================]-->
    <div id="header">
      <div class="header-left">
        <h1>Camunda Viewer</h1>
        <h2 id="currentDiagram">Select a diagram from the left menu</h2>
      </div>
      <div class="header-center" id="headerCenter">
        <!-- Zoom controls will be inserted here -->
      </div>
      <div class="header-right">
        <div id="businessKeyDisplay" class="business-key-display"></div>
      </div>
    </div>
    <!--#endregion-->
    
    <!-- ================== CANVAS SECTION ================== -->
    <!--#region-->
    <div id="canvas"></div>
    <!--#endregion-->
  </div>
  <!--#endregion-->

  <!--#region [================== SCRIPT LIBRARIES ==================]-->
  <!-- Load libraries from local -->
  <script src="/lib/bpmn-viewer.development.js"></script>
  <script src="/lib/dmn-viewer.development.js"></script>
  <!--#endregion-->

  <script>
    // Safe ID generation for DOM elements
    // Ensures valid HTML IDs that start with a letter and contain only safe characters
    /**
     * Sanitize a string to create a valid HTML DOM element ID
     * @param {string} str - The input string to sanitize
     * @returns {string} A valid HTML ID that starts with a letter and contains only safe characters
     */
    function sanitizeId(str) {
      if (!str) return 'id-default';
      
      let sanitized = String(str)
        .replace(/\s+/g, '-')           // Replace spaces with dashes
        .replace(/[^A-Za-z0-9-_]/g, '-') // Replace invalid chars with dashes (allow underscores)
        .replace(/-+/g, '-')            // Collapse multiple dashes
        .replace(/^-|-$/g, '');         // Remove leading/trailing dashes

      // Ensure ID starts with a letter (HTML requirement)
      if (!/^[a-zA-Z]/.test(sanitized)) {
        sanitized = 'id-' + sanitized;
      }
      
      // Ensure minimum length
      return sanitized || 'id-fallback';
    }
    
    /**
     * Generate consistent ID for deserialized variable containers
     * @param {string} variableName - Name of the variable
     * @param {string} processKey - Process definition key
     * @param {string} processInstanceId - Process instance identifier
     * @param {boolean} isExecution - Whether this is for execution variable display
     * @returns {string} Sanitized DOM element ID for the container
     */
    function generateDeserializedContainerId(variableName, processKey, processInstanceId, isExecution = false) {
      if (isExecution) {
        return sanitizeId(`deserialized-${variableName}-execution-${processInstanceId}`);
      }
      return sanitizeId(`deserialized-${variableName}-${processKey}-${processInstanceId}`);
    }
    
    /**
     * Escape HTML special characters to prevent XSS attacks
     * @param {string} text - The text to escape
     * @returns {string} HTML-escaped text safe for DOM insertion
     */
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    //#region [================== SESSION MANAGEMENT ==================]
    
    /**
     * Generate a cryptographically secure random ID with a given prefix
     * @param {string} prefix - The prefix for the ID (e.g., 'session', 'tab')
     * @returns {string} A secure random ID with timestamp and cryptographically secure random component
     */
    function generateSecureId(prefix = 'session') {
      const array = new Uint32Array(3); // Generate 3 random 32-bit integers
      window.crypto.getRandomValues(array);
      return (
        prefix +
        '_' +
        Date.now() +
        '_' +
        Array.from(array).map(n => n.toString(36)).join('')
      );
    }
    
    // Always generate unique session and tab IDs for each tab instance
    // This ensures proper isolation even when tabs are duplicated
    const sessionId = generateSecureId('session');
    const tabId = generateSecureId('tab');
    
    // Update the URL with the new session ID (without page reload)
    const newUrl = new URL(window.location);
    newUrl.searchParams.set('sessionId', sessionId);
    window.history.replaceState({}, '', newUrl);
    
    /**
     * Helper function to add session ID parameter to URLs
     * @param {string} url - The base URL to modify
     * @returns {string} URL with sessionId parameter appended
     */
    function addSessionParam(url) {
      const separator = url.includes('?') ? '&' : '?';
      return `${url}${separator}sessionId=${encodeURIComponent(sessionId)}`;
    }
    
    // Multiple event listeners for reliable tab close detection
    let pageHidden = false;
    let deregistrationSent = false;
    let isLastTab = false; // Cache last tab status
    
    /**
     * Safely deregister tab from server tracking
     * @param {string} source - Source of the deregistration call (for debugging)
     * @description Prevents duplicate deregistration calls and handles network failures gracefully
     */
    function safeDeregisterTab(source) {
      if (deregistrationSent || isShuttingDown) {
        console.log(`🔄 Tab deregistration skipped (${source}): already sent=${deregistrationSent}, shutting down=${isShuttingDown}`);
        return;
      }
      
      console.log(`📱 Deregistering tab: ${tabId} (source: ${source})`);
      deregistrationSent = true;
      
      if (navigator.sendBeacon) {
        const data = new Blob([JSON.stringify({ tabId: tabId })], { type: 'application/json' });
        navigator.sendBeacon('/deregister-tab', data);
      } else {
        // Fallback for older browsers - synchronous request
        try {
          const xhr = new XMLHttpRequest();
          xhr.open('POST', '/deregister-tab', false); // false = synchronous
          xhr.setRequestHeader('Content-Type', 'application/json');
          xhr.send(JSON.stringify({ tabId: tabId }));
        } catch (error) {
          console.warn('Failed to deregister tab:', error);
        }
      }
    }

    /**
     * Check if this is the last tab and update cached status
     * @description Updates isLastTab flag for use in beforeunload warnings
     * @returns {Promise<void>} Resolves when status check is complete
     */
    async function updateLastTabStatus() {
      try {
        const response = await fetch('/check-last-tab', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tabId: tabId })
        });
        
        if (response.ok) {
          const data = await response.json();
          isLastTab = data.isLastTab;
        }
      } catch (error) {
        console.warn('Failed to check last tab status:', error);
      }
    }

    // Update last tab status periodically and when visibility changes
    setInterval(updateLastTabStatus, 5000); // Check every 5 seconds
    updateLastTabStatus(); // Check immediately on load

    // Track when page becomes hidden (tab switch, minimize, close, etc.)
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'hidden') {
        pageHidden = true;
        // DO NOT deregister on visibilitychange - tabs should stay registered when hidden
        // Only deregister on actual page unload events (pagehide, beforeunload, unload)
      } else if (document.visibilityState === 'visible') {
        pageHidden = false;
        // Update last tab status when tab becomes visible
        updateLastTabStatus();
      }
    });

    // Page hide event (more reliable than unload for tab close)
    window.addEventListener('pagehide', function(event) {
      if (!event.persisted) {
        // Page is actually being unloaded (not going into cache)
        // This should only fire when the tab is actually being closed, not when switching tabs
        safeDeregisterTab('pagehide');
      }
    });

    // Beforeunload - show appropriate warning based on cached last tab status
    window.addEventListener('beforeunload', function(event) {
      if (isShuttingDown) {
        return;
      }

      let message = null;
      
      if (isLastTab) {
        message = 'If you close this tab, all data will be lost and the server will shut down.';
      } else if (availableDiagrams > 0) {
        message = 'If you close this tab, all data will be lost.';
      }
      
      if (message) {
        event.preventDefault();
        event.returnValue = message;
        return message;
      }
    });

    // Unload event as final fallback
    window.addEventListener('unload', function() {
      safeDeregisterTab('unload');
    });
    //#endregion

    //#region [================== GLOBAL VARIABLES ==================]
    let bpmnViewer = null;
    let dmnViewer = null;
    let currentViewer = null;
    let currentActiveLink = null;
    let currentInstance = -1; // -1 means Ready, 0+ means processing
    let totalInstances = 0;
    let availableDiagrams = 0; // Track number of available diagrams
    let isFetching = false; // Flag to track if we're in the middle of a fetch operation
    let tableZoomLevel = 1.0; // Current table zoom level
    let originalZoomLevel = 1.0; // Original zoom level set when diagram loads (for reset function)
    let isLoadingDiagrams = false; // Flag to prevent simultaneous loadExistingDiagrams calls
    let isShuttingDown = false; // Flag to bypass beforeunload confirmation during shutdown
    
    // Constants for timing
    const UI_TIMEOUT_DELAY = 500; // ms - general UI update delay
    
    //#endregion

    //#region [================== INITIALIZATION ==================]
    /**
     * Initialize the Camunda Viewer application when the page loads.
     * Sets up all necessary event handlers, loads existing diagrams,
     * and prepares the user interface for interaction.
     */
    document.addEventListener('DOMContentLoaded', async function() {
      setupBusinessKeyValidation();
      await loadExistingDiagrams('DOMContentLoaded');
      loadConfigFiles();
      checkForExistingLog();
      currentInstance = -1;
      updateProgressDisplay();
      initializeSplitter();
      setupBusinessKeyControls();
      loadProcessHistory();
      setupShutdownListeners(); // Setup cross-tab shutdown coordination
      await restoreCurrentBusinessKey(); // Restore Business Key from memory on page load
      hideZoomControls();
      
      // Register this tab for tracking
      await registerTab();
      
      // Setup window resize handler for third row positioning
      window.addEventListener('resize', function() {
        // Debounce the resize event to avoid excessive recalculations
        clearTimeout(window.thirdRowResizeTimeout);
        window.thirdRowResizeTimeout = setTimeout(recalculateThirdRowPosition, 150);
      });
    });
    //#endregion

    //#region [================== UI SPLITTER FUNCTIONALITY ==================]
    /**
     * Initialize the resizable splitter between left panel (menu) and right panel (diagram view).
     * Allows users to drag the splitter to resize panels between 15% and 60% width.
     * @description Sets up mouse event handlers for drag-to-resize functionality
     */
    function initializeSplitter() {
      const splitter = document.getElementById('splitter');
      const leftPanel = document.getElementById('leftPanel');
      const rightPanel = document.getElementById('rightPanel');
      let isResizing = false;

      splitter.addEventListener('mousedown', function(e) {
        isResizing = true;
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        e.preventDefault();
      });

      document.addEventListener('mousemove', function(e) {
        if (!isResizing) return;
        
        const containerWidth = window.innerWidth;
        const newLeftWidth = (e.clientX / containerWidth) * 100;
        
        // Set minimum and maximum widths (15% to 60%)
        if (newLeftWidth >= 15 && newLeftWidth <= 60) {
          leftPanel.style.width = newLeftWidth + '%';
          rightPanel.style.flex = 'none';
          rightPanel.style.width = (100 - newLeftWidth) + '%';
        }
      });

      document.addEventListener('mouseup', function() {
        if (isResizing) {
          isResizing = false;
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
        }
      });
    }
    //#endregion

    //#region [================== ZOOM FUNCTIONALITY ==================]
    /**
     * Zoom functions for both BPMN/DMN native viewers and custom DMN tables.
     * Uses font size scaling for custom tables to maintain readability and proper layout.
     * Supports mouse wheel zoom (Ctrl+scroll) and manual zoom controls.
     */
    
    /**
     * Increase zoom level by 10% (maximum 200%)
     * @description Calls setTableZoom with incremented zoom level
     */
    function zoomTableIn() {
      setTableZoom(tableZoomLevel + 0.1);
    }

    /**
     * Decrease zoom level by 10% (minimum 10%)
     * @description Calls setTableZoom with decremented zoom level
     */
    function zoomTableOut() {
      setTableZoom(tableZoomLevel - 0.1);
    }

    /**
     * Reset table/diagram zoom to the original level and recenter BPMN diagrams
     * @description For BPMN: uses fitToScreen to reset zoom and recenter. For DMN: resets to original zoom level.
     */
    function resetTableZoom() {
      // For BPMN diagrams, use existing fitToScreen function to reset zoom and recenter
      if (currentViewer === bpmnViewer && bpmnViewer) {
        fitToScreen();
      } else {
        // For DMN tables or other content, just reset zoom level
        setTableZoom(originalZoomLevel);
      }
    }

    /**
     * Fit BPMN diagram to screen and update zoom level tracking
     * @description Uses bpmn-js canvas.zoom('fit-viewport') and syncs zoom level with UI controls
     */
    function fitToScreen() {
      if (currentViewer === bpmnViewer && bpmnViewer) {
        try {
          const canvas = bpmnViewer.get('canvas');
          if (canvas && typeof canvas.zoom === 'function') {
            canvas.zoom('fit-viewport');
            
            // Get the actual zoom level after fit-viewport and sync our tracking
            setTimeout(() => {
              try {
                const actualZoom = canvas.zoom();
                if (actualZoom && !isNaN(actualZoom)) {
                  tableZoomLevel = actualZoom;
                  originalZoomLevel = actualZoom; // Update original zoom level when manually fitting to screen
                  // Update the zoom input to reflect the actual zoom level
                  const zoomInput = document.querySelector('.zoom-input');
                  if (zoomInput) {
                    zoomInput.value = Math.round(tableZoomLevel * 100);
                  }
                }
              } catch (e) {
                console.warn('Could not sync zoom level after fit-to-screen:', e);
              }
            }, 100);
          }
        } catch (e) {
          console.error('Error fitting to screen:', e);
        }
      }
    }

    /**
     * Set specific zoom level within allowed range (10% to 200%)
     * @param {number} zoomValue - Target zoom level (0.1 to 2.0)
     * @description Clamps value, updates state, and ensures consistent application and header alignment
     */
    function setTableZoom(zoomValue) {
      tableZoomLevel = Math.max(0.1, Math.min(2.0, zoomValue));
      applyTableZoom();
      recalculateThirdRowPosition();
    }

    /**
     * Apply current zoom level to all zoomable elements
     * @description Updates font sizes of elements with data-base-font-size attributes and zoom input display
     */
    function applyTableZoom() {
      const zoomInput = document.querySelector('.zoom-input');
      
      if (currentViewer) {
        try {
          if (currentViewer.get && typeof currentViewer.get === 'function') {
            const canvas = currentViewer.get('canvas');
            if (canvas && typeof canvas.zoom === 'function') {
              // For BPMN diagrams, always use numeric zoom for smooth transitions
              if (currentViewer === bpmnViewer) {
                canvas.zoom(tableZoomLevel);
              } else {
                // For DMN and other viewers, use numeric zoom
                canvas.zoom(tableZoomLevel);
              }
              if (zoomInput) {
                zoomInput.value = Math.round(tableZoomLevel * 100);
              }
              return;
            }
          }
        } catch (err) {
          console.error('Native zoom failed, falling back to font scaling:', err);
        }
      }
      
      const zoomContainer = document.querySelector('.table-zoom-container');
      if (zoomContainer) {
        // Apply font size scaling for DMN tables
        const baseFontSize = 11; // Base font size in pixels
        const scaledFontSize = baseFontSize * tableZoomLevel;
        
        requestAnimationFrame(() => {
          // Apply font size to the table content
          const scrollContainer = zoomContainer.querySelector('.dmn-table-scroll-container');
          if (scrollContainer) {
            scrollContainer.style.fontSize = `${scaledFontSize}px`;
            
            // CSS handles: overflow, maxWidth, maxHeight
            
            // Also update any nested table elements to inherit the font size
            const table = scrollContainer.querySelector('table');
            if (table) {
              // CSS handles: fontSize inherit, width, minWidth
            }
          }
          
          // Apply font size scaling to literal expressions using data attributes
          const literalExpressions = zoomContainer.querySelectorAll('.literal-expression-container');
          literalExpressions.forEach(container => {
            // Update the main container font size
            const baseSize = parseInt(container.getAttribute('data-base-font-size')) || 11;
            container.style.fontSize = `${baseSize * tableZoomLevel}px`;
            
            // Update all child elements with data-base-font-size attributes
            const childElements = container.querySelectorAll('[data-base-font-size]');
            childElements.forEach(child => {
              const childBaseSize = parseInt(child.getAttribute('data-base-font-size'));
              if (!isNaN(childBaseSize)) {
                child.style.fontSize = `${childBaseSize * tableZoomLevel}px`;
              }
            });
          });
          
          // Wait for DOM to fully update before recalculating third row position
          setTimeout(() => {
            recalculateThirdRowPosition();
          }, 10); // Small delay to ensure font changes are applied
        });
      }
      
      if (zoomInput) {
        zoomInput.value = Math.round(tableZoomLevel * 100);
      }
    }
    //#endregion

    //#region [================== THIRD ROW HEADER POSITIONING ==================] 
    /**
     * Recalculate and update the sticky position of the third header row in DMN tables.
     * This ensures proper positioning when window is resized or zoom level changes.
     */
    function recalculateThirdRowPosition() {
      // Find all DMN tables with multiple header rows that need repositioning
      const scrollContainers = document.querySelectorAll('.dmn-table-scroll-container');
      
      scrollContainers.forEach(scrollContainer => {
        const table = scrollContainer.querySelector('#dmn-decision-table');
        if (!table) return;
        
        const thead = table.querySelector('thead');
        if (!thead) return;
        
        const rows = thead.querySelectorAll('tr');
        if (rows.length < 2) return;
        
        const firstRow = rows[0];
        const secondRow = rows[1];
        
        // Calculate actual height of first row for second row positioning
        const firstHeight = firstRow.getBoundingClientRect().height;
        
        // Set CSS custom properties for dynamic positioning
        scrollContainer.style.setProperty('--first-row-height', `${firstHeight}px`);
        
        // If there's a third row, calculate combined height
        if (rows.length >= 3) {
          const thirdRow = rows[2];
          const secondHeight = secondRow.getBoundingClientRect().height;
          const combinedHeight = firstHeight + secondHeight;
          
          scrollContainer.style.setProperty('--first-two-rows-height', `${combinedHeight}px`);
        }
      });
    }

    function handleZoomInputChange(event) {
      const value = parseInt(event.target.value);
      if (!isNaN(value) && value > 0) {
        setTableZoom(value / 100);
      } else {
        event.target.value = Math.round(tableZoomLevel * 100);
      }
    }

    function handleZoomInputKeyPress(event) {
      if (event.key === 'Enter') {
        event.target.blur();
      }
    }

    function setupTableZoomMouseWheel() {
      const canvas = getCanvas();
      canvas.removeEventListener('wheel', handleTableZoomWheel);
      canvas.addEventListener('wheel', handleTableZoomWheel, { passive: false });
    }

    function handleTableZoomWheel(event) {
      if (!event.ctrlKey) return;
      
      const elementUnderCursor = document.elementFromPoint(event.clientX, event.clientY);
      if (!elementUnderCursor) return;
      
      const isOverNativeViewer = currentViewer && (
        elementUnderCursor.closest('.bjs-container') || 
        elementUnderCursor.closest('.dmn-js-container') ||
        elementUnderCursor.closest('svg')
      );
      
      const zoomContainer = document.querySelector('.table-zoom-container');
      const isOverManualTable = zoomContainer && (
        zoomContainer.contains(elementUnderCursor) || 
        elementUnderCursor === zoomContainer
      );
      
      if (!isOverNativeViewer && !isOverManualTable) {
        return;
      }
      
      event.preventDefault();
      event.stopPropagation();
      
      const zoomDelta = event.deltaY < 0 ? 0.1 : -0.1;
      const newZoom = Math.max(0.1, Math.min(5.0, tableZoomLevel + zoomDelta));
      
      setTableZoom(newZoom);
    }

    /**
     * Show zoom controls when a diagram is loaded
     */
    function showZoomControls() {
      const existingControls = document.querySelector('.table-zoom-controls');
      if (existingControls) {
        existingControls.classList.remove('hidden');
        existingControls.classList.add('flex-visible');
      }
    }

    /**
     * Hide zoom controls when no diagram is displayed
     */
    function hideZoomControls() {
      const existingControls = document.querySelector('.table-zoom-controls');
      if (existingControls) {
        existingControls.classList.remove('flex-visible');
        existingControls.classList.add('hidden');
      }
    }

    /**
     * Create zoom control buttons for diagram/table zoom functionality.
     * Removes any existing controls first to prevent duplicates.
     */
    function createZoomControls() {
      // Remove any existing zoom controls
      const existingControls = document.querySelector('.table-zoom-controls');
      if (existingControls) {
        existingControls.remove();
      }
      
      const zoomControlsDiv = document.createElement('div');
      zoomControlsDiv.className = 'table-zoom-controls';
      
      // Base zoom controls (always present)
      let controlsHTML = `
        <button class="zoom-button" onclick="zoomTableOut()" title="Zoom Out (Ctrl+Scroll)">-</button>
        <input class="zoom-input" 
               type="number" 
               min="10" 
               max="200" 
               value="100" 
               onchange="handleZoomInputChange(event)" 
               onkeypress="handleZoomInputKeyPress(event)" 
               title="Enter zoom percentage (10-200%)">
        <span class="percentage-text">%</span>
        <button class="zoom-button" onclick="zoomTableIn()" title="Zoom In (Ctrl+Scroll)">+</button>
        <button class="zoom-button" onclick="resetTableZoom()" title="Reset to original zoom level">Reset</button>`;
      
      // Copy table button (for DMN tables)
      controlsHTML += `
        <button class="copy-table-button" id="copyTableButton" onclick="copyTableToClipboard()" title="Copy table data for Excel/spreadsheets">📋 Copy Table</button>
      `;
      
      zoomControlsDiv.innerHTML = controlsHTML;
      const headerCenter = document.getElementById('headerCenter');
      headerCenter.appendChild(zoomControlsDiv);
      showZoomControls();
    }
    //#endregion

    //#region [================== PROGRESS AND UI UPDATES ==================]
    /**
     * Update the progress display based on current processing state.
     * Shows different messages for Ready, Processing, or Error states.
     */
    function updateProgressDisplay() {
      const progressCounter = getProgressCounter();
      const progressMessage = getProgressMessage();
      
      if (isLoadingDiagrams) {
        progressCounter.textContent = 'Loading Processes...';
        progressMessage.classList.add('hidden');
      } else if (currentInstance === -1) {
        progressCounter.textContent = availableDiagrams === 0 ? 'No Diagrams Available' : 'Diagrams Ready';
        progressMessage.classList.add('hidden');
      } else {
        // Show progress message for all processing states
        progressMessage.classList.remove('hidden');
        
        if (currentInstance === 0 && totalInstances === 0) {
          progressCounter.textContent = 'No process instances found';
        } else if (currentInstance === 0) {
          progressCounter.textContent = 'Initializing...';
        } else if (totalInstances === 1) {
          progressCounter.textContent = `Processing single instance`;
        } else if (totalInstances > 1) {
          progressCounter.textContent = `Processing ${currentInstance} of ${totalInstances} BPMN Files`;
        } else if (currentInstance > 0) {
          progressCounter.textContent = `Processing instance ${currentInstance}...`;
        } else {
          progressCounter.textContent = 'Processing...';
        }
      }
    }
    //#endregion

    //#region [================== FORM VALIDATION ==================]
    /**
     * Set up real-time validation for the Business Key input field.
     * Validates that input contains only numeric characters.
     * Enables/disables the fetch button based on input validity.
     */
    function setupBusinessKeyValidation() {
      const input = getBusinessKeyInput();
      const button = getProcessButton();
      const message = getValidationMessage();
      
      input.addEventListener('input', function() {
        const value = input.value.trim();
        const isValid = value.length > 0; // Business keys just need to be non-empty
        
        // Don't modify button state if we're currently fetching data
        if (isFetching) {
          return;
        }
        
        if (value.length === 0) {
          input.classList.remove('invalid');
          button.disabled = false;
          message.textContent = '';
        } else if (isValid) {
          input.classList.remove('invalid');
          button.disabled = false;
          message.textContent = '';
        } else {
          input.classList.add('invalid');
          button.disabled = true;
          message.textContent = 'Input is Numeric Characters only! No decimals!';
        }
      });
      
      button.addEventListener('click', function(event) {
        if (button.disabled) {
          event.preventDefault();
          event.stopPropagation();
          return false;
        }
      });
    }
    //#endregion

    //#region [================== DATA LOADING FUNCTIONS ==================]
    /**
     * Load existing diagram files from the server and build the process hierarchy.
     * Only loads if not currently fetching data to avoid conflicts.
     * @param {string} caller - Identifier of the calling function for debugging
     * @description Fetches diagram list from server and rebuilds the process hierarchy display
     */
    async function loadExistingDiagrams(caller = 'unknown') {
      if (isFetching) {
        return;
      }
      
      if (isLoadingDiagrams) {
        return;
      }
      
      isLoadingDiagrams = true;
      updateProgressDisplay(); // Show "Loading Processes..." immediately
      
      try {
        availableDiagrams = 0;
        
        const res = await fetch(addSessionParam('/list'));
        if (!res.ok) {
          throw new Error(`HTTP error! status: ${res.status}`);
        }
        const files = await res.json();
        
        // Ensure files is an array before processing
        if (Array.isArray(files)) {
          await buildProcessHierarchy(files);
        } else {
          await buildProcessHierarchy([]);
        }
      } catch (error) {
        await buildProcessHierarchy([]);
      } finally {
        isLoadingDiagrams = false;
        updateProgressDisplay(); // Show "Diagrams Ready" or appropriate state
      }
    }

    /**
     * Load available configuration files from server
     * @description Fetches list of config-*.cfg files and populates environment dropdown
     * @returns {Promise<void>} Resolves when config files are loaded and dropdown is populated
     */
    async function loadConfigFiles() {
      try {
        const response = await fetch('/config-files');
        const data = await response.json();
        
        const environmentSelect = getEnvironmentSelect();
        environmentSelect.innerHTML = '';
        
        if (data.configFiles && data.configFiles.length > 0) {
          data.configFiles.forEach(config => {
            const option = document.createElement('option');
            option.value = config.env;
            option.textContent = config.displayName;
            environmentSelect.appendChild(option);
          });
          environmentSelect.value = 'local';
        } else {
          const option = document.createElement('option');
          option.value = 'local';
          option.textContent = 'Local (default)';
          environmentSelect.appendChild(option);
          environmentSelect.value = 'local';
        }
      } catch (error) {
        const environmentSelect = getEnvironmentSelect();
        environmentSelect.innerHTML = '<option value="local">Local (default)</option>';
        environmentSelect.value = 'local';
      }
    }

    /**
     * Check for existing session log and update log action button visibility
     * @description Queries server for log content and shows/hides log buttons accordingly
     * @returns {Promise<void>} Resolves when log check is complete
     */
    async function checkForExistingLog() {
      try {
        const response = await fetch(`/get-log?sessionId=${sessionId}`);
        const data = await response.json();
        
        if (data.exists && data.content && data.content.trim().length > 0) {

          // Hide log buttons if no log entries for this session

    //#region [================== CLAIM DATA FETCHING ==================]
    /**
     * Functions for fetching process execution data from Camunda via PowerShell scripts.
     * Handles real-time progress updates and streaming responses from the server.
     */
    
    /**
     * Display a spinner overlay in the file list area during data fetching operations.
     * Shows an animated loading indicator with descriptive text.
     */
    function showSpinner() {
      const fileList = getFileList();
      fileList.innerHTML = `
        <div class="spinner-container">
          <div class="spinner"></div>
          <div class="spinner-text">Fetching process data...</div>
        </div>
      `;
    }

    /**
     * Hide the spinner overlay and restore the file list area to its normal state.
     * Used after data fetching operations complete (success or failure).
     */
    function hideSpinner() {
      isFetching = false;
      const fileList = getFileList();
      fileList.innerHTML = '';
    }

    async function fetchProcessData() {
      const businessKeyInput = getBusinessKeyInput();
      const environmentSelect = getEnvironmentSelect();
      const maxRunsInput = getMaxRunsInput();
      const button = getProcessButton();
      const progressCounter = getProgressCounter();
      const progressMessage = getProgressMessage();
      const validationMessage = getValidationMessage();
      
      let businessKey = businessKeyInput.value.trim();
      let maxRuns = parseInt(maxRunsInput.value) || 5;
      
      // PHASE 1: Input validation and setup
      // If input is empty, show validation error
      if (businessKey === '') {
        validationMessage.textContent = 'Please enter a Business Key!';
        return;
      }
      
      // Validate maxRuns
      if (maxRuns < 1 || maxRuns > 50) {
        validationMessage.textContent = 'Max Runs must be between 1 and 50!';
        return;
      }
      
      validationMessage.textContent = '';
      updateBusinessKeyDisplay('');
      
      // Phase 1: Simple initialization
      progressCounter.textContent = 'Initializing Data Fetch...';
      progressMessage.textContent = 'Preparing for data fetch...';
      progressMessage.className = 'progress-message';
      progressMessage.classList.remove('hidden');
      
      // Reset progress message styling to clear any previous error states
      progressMessage.style.color = '';
      progressMessage.style.fontWeight = '';
      progressMessage.className = progressMessage.className.replace(/message-(error|success|warning|info)/g, '');
      
      // Save to history immediately when user hits the button (before processing starts)
      const environment = environmentSelect.value || 'local';
      saveProcessToHistory(environment, businessKey);
      
      // Clear the canvas/display area when starting new data fetch
      const canvas = getCanvas();
      canvas.innerHTML = '<div class="canvas-placeholder">Select a diagram from the menu to view</div>';
      hideZoomControls();
      
      // Clear the header title
      const headerElement = getCurrentDiagram();
      headerElement.textContent = 'Select a Diagram from the Menu';
      
      // Disable UI controls to prevent multiple concurrent fetches
      setProcessFetchingUIState(false);
      
      isFetching = true; // Set flag to indicate we're fetching
      currentInstance = 0; // Set to 0 to indicate we're starting
      totalInstances = 0;
      
      // Hide log buttons during fetch
      getLogActions().classList.add('hide');
      
      // Show spinner to replace the file list during processing
      showSpinner();
      
      // Reset progress message styling
      progressMessage.className = 'progress-message';
      
      // Transition to Phase 2
      progressCounter.textContent = 'Starting data fetch from Camunda';
      progressMessage.textContent = 'Connecting to Camunda APIs...';
      
      try {
        // Call the PowerShell script via our server endpoint
        const response = await fetch('/fetch-process', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ 
            businessKey: businessKey,
            environment: environment,
            maxRuns: maxRuns,
            sessionId: sessionId
          })
        });
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        // Check if the response is a streaming response
        const contentType = response.headers.get('content-type');
        if (contentType && contentType.includes('text/plain')) {
          // Handle streaming progress updates (Phase 2)
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            
            const chunk = decoder.decode(value);
            const lines = chunk.split('\n');
            
            for (const line of lines) {
              if (line.trim()) {
                try {
                  const data = JSON.parse(line);
                  if (data.type === 'progress') {
                    // Apply progress updates with controlled timing to prevent UI blocking
                    const progressCounter = getProgressCounter();
                    if (!progressCounter) return;
                    
                    // Update global variables first
                    if (data.total !== undefined) {
                      totalInstances = data.total;
                    }
                    if (data.current !== undefined) {
                      currentInstance = data.current;
                    }
                    
                    // Build progress text
                    let progressText = `Saving BPMN file: ${currentInstance} of ${totalInstances}`;
                    
                    // Add DMN progress if available
                    if (data.dmnCurrent !== undefined && data.dmnTotal !== undefined && data.dmnTotal > 0) {
                      progressText += ` | Saving DMN file: ${data.dmnCurrent} of ${data.dmnTotal}`;
                    }
                    
                    // Apply to DOM immediately
                    progressCounter.textContent = progressText;
                    
                    // Add 500ms pause to slow down updates and prevent UI blocking
                    await new Promise(resolve => setTimeout(resolve, 0.001));
                  } else if (data.type === 'complete') {
                    // STEP 1: Data fetch complete - update progress counter immediately
                    const progressCounter = getProgressCounter();
                    progressCounter.textContent = 'Correlating Processes...';
                    
                    if (totalInstances === 0) {
                      progressMessage.textContent += '\nNo process instances found for this Business Key.';
                    } else {
                      progressMessage.textContent += '\nProcessing data files...';
                    }
                    
                    // STEP 2: Process completion asynchronously for better performance
                    // No delay needed since saving phase is already controlled
                    (async () => {
                      // Hide spinner first
                      hideSpinner();
                      
                      // Load diagrams asynchronously - this can be fast now
                      await loadExistingDiagrams('fetchClaim-complete');
                      
                      // STEP 3: Final UI updates - immediate since correlation/loading can be fast
                      currentInstance = -1; // Set to -1 to indicate Ready
                      isFetching = false; // Clear the fetching flag
                      updateProgressDisplay();
                      
                      // Re-enable UI controls after completion
                      setProcessFetchingUIState(true);
                      
                      // Show log buttons after completion
                      getLogActions().classList.remove('hide');
                      getLogActions().classList.add('show-flex');
                    
                      if (totalInstances === 0) {
                        progressMessage.textContent = 'No process instances found. Try a different Business Key.';
                      } else {
                        progressMessage.textContent = 'Ready to explore diagrams!';
                        // Update Business Key display after successful fetch
                        updateBusinessKeyDisplay(businessKey);
                      }
                    })();
                  } else if (data.type === 'connection_error') {
                    // Handle connection errors specifically
                    currentInstance = -1; // Reset to Ready state
                    isFetching = false; // Clear the fetching flag
                    
                    // Show connection error message
                    showErrorMessage(data.message, true, 'Connection Failed');
                    
                    // Hide spinner by replacing file list content
                    const fileList = getFileList();
                    fileList.innerHTML = `
                      <div class="center-message">
                        <div class="large-icon">⚠️</div>
                        <div class="connection-error">Connection Error</div>
                        <div class="small-text">Check network connectivity and server configuration</div>
                      </div>
                    `;
                    
                    // Show log buttons (there might be partial log data)
                    getLogActions().classList.remove('hide');
                    getLogActions().classList.add('show-flex');
                    
                    // Re-enable UI controls
                    setProcessFetchingUIState(true);
                    return; // Exit to prevent further processing
                  } else if (data.type === 'error') {
                    // Handle other types of errors
                    currentInstance = -1; // Reset to Ready state
                    isFetching = false; // Clear the fetching flag
                    updateProgressDisplay();
                    
                    showErrorMessage(data.message);
                    
                    // Hide spinner on error
                    hideSpinner();
                    
                    // Show log buttons (there might be partial log data)
                    getLogActions().classList.remove('hide');
                    getLogActions().classList.add('show-flex');
                    
                    // Re-enable UI controls
                    setProcessFetchingUIState(true);
                    return; // Exit to prevent further processing
                  }
                } catch (e) {
                  // Not JSON, might be regular output - send immediately without batching
                  if (line.trim().length > 0 && !line.includes('Decision instance details')) {
                    // Send each line immediately to progress message
                    const currentContent = progressMessage.textContent;
                    const newContent = currentContent + (currentContent ? '\n' : '') + line.trim();
                    progressMessage.textContent = newContent;
                    progressMessage.scrollTop = progressMessage.scrollHeight;
                  }
                }
              }
            }
            
            // No more buffering - all output sent immediately above
          }
        } else {
          // Handle regular JSON response (fallback)
          const result = await response.json();
          if (result.success) {
            progressCounter.textContent = 'Correlating Processes...';
            progressMessage.textContent += '\nProcessing data files...';
            
            setTimeout(async () => {
              hideSpinner();
              await loadExistingDiagrams('fetchClaim-regularJSON');
              // Only reset to Ready after refresh is complete
              setTimeout(() => {
                currentInstance = -1; // Set to -1 to indicate Ready
                updateProgressDisplay();
                progressMessage.textContent = 'Ready to explore diagrams!';
                // Update Business Key display after successful fetch
                updateBusinessKeyDisplay(businessKey);
              }, UI_TIMEOUT_DELAY);
            }, 1000);
          } else {
            throw new Error(result.error || 'Unknown error occurred');
          }
        }
        
      } catch (error) {
        currentInstance = -1; // Reset to Ready state
        isFetching = false; // Clear the fetching flag
        updateProgressDisplay();
        
        // Show error message
        showErrorMessage(error.message);
        
        // Show log buttons even on error (there might be partial log data)
        getLogActions().classList.remove('hide');
        getLogActions().classList.add('show-flex');
        
        // Hide spinner on error and reload existing diagrams
        hideSpinner();
        await loadExistingDiagrams('fetchClaim-error'); // Load existing diagrams on error
      } finally {
        // Re-enable UI controls if input is valid or if empty (can use current claim)
        const inputValue = businessKeyInput.value.trim();
        if (inputValue === '' || inputValue.length > 0) {
          setProcessFetchingUIState(true);
        }
      }
    }
    //#endregion

    //#region [================== PROCESS HIERARCHY BUILDING ==================]
    /**
     * Functions for organizing and displaying process instances in a hierarchical structure.
     * Groups BPMN processes with their related DMN decisions, sorted by execution time.
     * 
     * PHASE 3: Synchronous processing with clear progress reporting
     */
    async function buildProcessHierarchy(files) {
      const listDiv = getFileList();
      
      // Clear previous content
      listDiv.innerHTML = '';
      
      // Separate BPMN and DMN files
      const bpmnFiles = files.filter(file => file.endsWith('.bpmn'));
      const dmnFiles = files.filter(file => file.endsWith('.dmn'));
      
      // Process BPMN files synchronously (no progress updates - moves quick)
      const bpmnData = [];
      for (let i = 0; i < bpmnFiles.length; i++) {
        const bpmnFile = bpmnFiles[i];
        
        const jsonFile = bpmnFile.replace('.bpmn', '.json');
        try {
          const response = await fetch(addSessionParam(`/diagrams/${jsonFile}`));
          const data = await response.json();
          bpmnData.push({
            file: bpmnFile,
            processKey: bpmnFile.replace(/-.+\.bpmn$/, '').replace('.bpmn', ''),
            processInstanceId: data.processInstanceId || 'unknown',
            startTime: data.startTime || null,
            endTime: data.endTime || null,
            displayName: bpmnFile.replace(/-.+\.bpmn$/, '').replace('.bpmn', ''),
            displayTime: data.startTime ? new Date(data.startTime).toLocaleString() : ''
          });
        } catch (err) {
          bpmnData.push({
            file: bpmnFile,
            processKey: bpmnFile.replace(/-.+\.bpmn$/, '').replace('.bpmn', ''),
            processInstanceId: 'unknown',
            startTime: null,
            endTime: null,
            displayName: bpmnFile.replace(/-.+\.bpmn$/, '').replace('.bpmn', ''),
            displayTime: ''
          });
        }
      }

      // Process DMN files synchronously (no progress updates - moves quick)
      const dmnData = [];
      for (let i = 0; i < dmnFiles.length; i++) {
        const dmnFile = dmnFiles[i];
        
        const jsonFile = dmnFile.replace('.dmn', '.json');
        try {
          const response = await fetch(addSessionParam(`/diagrams/${jsonFile}`));
          const data = await response.json();
          
          // Handle different JSON structures our script creates
          let decisionName = null;
          let hasExecutedRules = false;
          
          // Check if we have instanceDetails (our newer format)
          if (data.instanceDetails && data.instanceDetails.decisionDefinitionName) {
            decisionName = data.instanceDetails.decisionDefinitionName;
          } else {
            // Extract decision name from filename as fallback
            decisionName = dmnFile.replace(/-.+\.dmn$/, '').replace('.dmn', '');
          }
          
          // Check for executed rules in various formats
          if (data.executedRules) {
            if (Array.isArray(data.executedRules) && data.executedRules.length > 0) {
              hasExecutedRules = true;
            } else if (typeof data.executedRules === 'string' && data.executedRules.length > 0) {
              hasExecutedRules = true;
            } else if (typeof data.executedRules === 'object' && Object.keys(data.executedRules).length > 0) {
              hasExecutedRules = true;
            }
          }
          
          // Also check if we have outputs with ruleId (indicates execution)
          if (!hasExecutedRules && data.outputs && Array.isArray(data.outputs)) {
            hasExecutedRules = data.outputs.some(output => output.ruleId);
          }
          
          // More lenient filtering - include if we have ANY useful data
          // Only filter out if we have absolutely no usable data
          if (!decisionName && !hasExecutedRules && (!data.outputs || data.outputs.length === 0) && 
              !data.instanceDetails && !data.evaluationTime && !data.startTime) {
            // Skip DMN files with no useful execution data - don't add to array
            continue;
          }
          
          // Try multiple sources for evaluation time
          let evaluationTime = '';
          let displayTime = '';
          
          // Try to get timestamp from decisionInstances array first
          if (data.decisionInstances && Array.isArray(data.decisionInstances) && data.decisionInstances.length > 0) {
            const firstInstance = data.decisionInstances[0];
            
            if (firstInstance.evaluationTime) {
              evaluationTime = firstInstance.evaluationTime;
              displayTime = new Date(firstInstance.evaluationTime).toLocaleString();
            } else if (firstInstance.startTime) {
              evaluationTime = firstInstance.startTime;
              displayTime = new Date(firstInstance.startTime).toLocaleString();
            }
          }
          
          // Fall back to other locations if not found in decisionInstances
          if (!evaluationTime && data.instanceDetails?.evaluationTime) {
            evaluationTime = data.instanceDetails.evaluationTime;
            displayTime = new Date(data.instanceDetails.evaluationTime).toLocaleString();
          } else if (!evaluationTime && data.evaluationTime) {
            evaluationTime = data.evaluationTime;
            displayTime = new Date(data.evaluationTime).toLocaleString();
          } else if (!evaluationTime && data.startTime) {
            evaluationTime = data.startTime;
            displayTime = new Date(data.startTime).toLocaleString();
          }
          
          dmnData.push({
            file: dmnFile,
            processKey: data.instanceDetails?.processDefinitionKey || 'unknown',
            processInstanceId: data.instanceDetails?.processInstanceId || 'unknown',
            evaluationTime: evaluationTime,
            decisionName: decisionName,
            displayTime: displayTime,
            hasRuleData: hasExecutedRules,
            hasOutputData: data.outputs && data.outputs.length > 0
          });
        } catch (err) {
          // Skip files that can't be loaded - continue to next iteration
          continue;
        }
      }
      
      // Use dmnData directly (already filtered during processing)
      const validDmnData = dmnData;
      
      // Group BPMN files by process type (not individual instances)
      const bpmnByProcessType = new Map();
      bpmnData.forEach(bpmn => {
        if (!bpmnByProcessType.has(bpmn.processKey)) {
          bpmnByProcessType.set(bpmn.processKey, []);
        }
        bpmnByProcessType.get(bpmn.processKey).push(bpmn);
      });
      
      // Sort instances within each process type by start time
      bpmnByProcessType.forEach(instances => {
        instances.sort((a, b) => {
          if (!a.startTime || !b.startTime) return 0;
          return new Date(a.startTime) - new Date(b.startTime);
        });
      });
      
      // Group DMN files by process key and process instance
      const dmnByProcess = new Map();
      validDmnData.forEach(dmn => {
        const key = `${dmn.processKey}-${dmn.processInstanceId}`;
        if (!dmnByProcess.has(key)) {
          dmnByProcess.set(key, []);
        }
        dmnByProcess.get(key).push(dmn);
      });
      
      dmnByProcess.forEach(dmnList => {
        dmnList.sort((a, b) => {
          if (!a.evaluationTime || !b.evaluationTime) return 0;
          return new Date(a.evaluationTime) - new Date(b.evaluationTime);
        });
      });

      // Sort process types by earliest execution time
      const sortedProcessTypes = Array.from(bpmnByProcessType.entries()).sort((a, b) => {
        const aEarliest = a[1][0]?.startTime;
        const bEarliest = b[1][0]?.startTime;
        
        if (!aEarliest && !bEarliest) return 0;
        if (!aEarliest) return 1;
        if (!bEarliest) return -1;
        
        return new Date(aEarliest) - new Date(bEarliest);
      });
      
      // Create run numbering based on starter process execution times
      // Find the process that executes first (earliest overall start time) - this is our "starter" process
      let starterProcessKey = null;
      let earliestTime = null;
      
      bpmnData.forEach(bpmn => {
        if (bpmn.startTime) {
          const startTime = new Date(bpmn.startTime).getTime();
          if (!earliestTime || startTime < earliestTime) {
            earliestTime = startTime;
            starterProcessKey = bpmn.processKey;
          }
        }
      });
      
      // Get all execution times of the starter process to define run boundaries
      const starterExecutions = bpmnData
        .filter(bpmn => bpmn.processKey === starterProcessKey && bpmn.startTime)
        .map(bpmn => ({
          startTime: bpmn.startTime,
          startTimeMs: new Date(bpmn.startTime).getTime()
        }))
        .sort((a, b) => a.startTimeMs - b.startTimeMs);
      
      // Create mapping from any BPMN to its run number based on starter process timing
      const bpmnToRunNumber = new Map();
      
      bpmnData.forEach(bpmn => {
        if (!bpmn.startTime) return;
        
        const bpmnTime = new Date(bpmn.startTime).getTime();
        const bpmnKey = `${bpmn.processKey}-${bpmn.processInstanceId}`;
        
        // Find the most recent starter execution before or at this BPMN's time
        let runNumber = 1; // Default to run 1
        
        for (let i = starterExecutions.length - 1; i >= 0; i--) {
          if (starterExecutions[i].startTimeMs <= bpmnTime) {
            runNumber = i + 1;
            break;
          }
        }
        
        bpmnToRunNumber.set(bpmnKey, runNumber);
      });
      
      // Create the collapsible structure grouped by process type
      sortedProcessTypes.forEach(([processKey, instances]) => {
        
        // Create process type group
        const processGroup = document.createElement('div');
        processGroup.className = 'process-group';
        
        // Process type header (collapsible)
        const headerDiv = document.createElement('div');
        headerDiv.className = 'process-header';
        headerDiv.onclick = () => toggleProcess(headerDiv, processGroup);
        
        const collapseIcon = document.createElement('span');
        collapseIcon.className = 'collapse-icon';
        collapseIcon.textContent = '▶';
        headerDiv.appendChild(collapseIcon);
        
        const titleSpan = document.createElement('span');
        titleSpan.className = 'process-title';
        
        // Get the earliest timestamp from instances
        const earliestInstance = instances.reduce((earliest, current) => {
          if (!earliest || !earliest.startTime) return current;
          if (!current.startTime) return earliest;
          return new Date(current.startTime) < new Date(earliest.startTime) ? current : earliest;
        });
        
        const headerText = earliestInstance && earliestInstance.displayTime 
          ? `${processKey} - ${earliestInstance.displayTime}`
          : processKey;
        
        titleSpan.textContent = headerText;
        headerDiv.appendChild(titleSpan);
        
        processGroup.appendChild(headerDiv);
        
        // Process content (collapsible)
        const contentDiv = document.createElement('div');
        contentDiv.className = 'process-content';
        
          // Create instances
        instances.forEach((bpmn, index) => {
          const instanceDiv = document.createElement('div');
          instanceDiv.className = 'process-instance margin-left-20 margin-bottom-10';
          
          // Get run number based on starter process timing
          const bpmnKey = `${bpmn.processKey}-${bpmn.processInstanceId}`;
          const runNumber = bpmnToRunNumber.get(bpmnKey) || (index + 1);
          
          // Instance header
          const instanceHeader = document.createElement('div');

    /**
     * Toggle the expanded/collapsed state of a process group in the navigation tree.
     * @param {HTMLElement} header - The clickable header element of the process group
     * @param {HTMLElement} group - The entire process group container element
     */
    function toggleProcess(header, group) {
      const content = group.querySelector('.process-content');
      const icon = header.querySelector('.collapse-icon');
      
      if (content.classList.contains('expanded')) {
        content.classList.remove('expanded');
        header.classList.remove('expanded');
        icon.classList.remove('expanded');
        icon.textContent = '▶';
      } else {
        content.classList.add('expanded');
        header.classList.add('expanded');
        icon.classList.add('expanded');
        icon.textContent = '▼';
      }
    }

    /**
     * Set the active link in the navigation tree and remove active state from other links.
     * @param {HTMLElement} link - The link element to set as active
     */
    function setActiveLink(link) {
      if (currentActiveLink) {
        currentActiveLink.classList.remove('active');
      }
      currentActiveLink = link;
      link.classList.add('active');
    }

    /**
     * Setup mouse-based panning controls for a BPMN diagram canvas.
     * Enables drag-to-pan functionality with mouse button state tracking.
     * @param {HTMLElement} bpmnCanvas - The BPMN canvas element to add panning to
     * @param {HTMLElement} container - The container element that holds the canvas
     */
    function setupBpmnPanControls(bpmnCanvas, container) {
      let isPanning = false;
      let startX, startY, startViewbox;

      // Styles are now defined in viewer.css - no need for inline styles

      container.classList.add('bpmn-pan-container');

      document.addEventListener('keydown', (e) => {
        if (e.ctrlKey) {
          container.classList.add('ctrl-pressed');
        }
      });

      document.addEventListener('keyup', (e) => {
        if (!e.ctrlKey) {
          container.classList.remove('ctrl-pressed');
        }
      });

      window.addEventListener('blur', () => {
        container.classList.remove('ctrl-pressed');
      });

      container.addEventListener('mousedown', (e) => {
        if (e.button === 1 || (e.button === 0 && e.ctrlKey)) {
          e.preventDefault();
          e.stopPropagation();
          isPanning = true;
          startX = e.clientX;
          startY = e.clientY;
          startViewbox = bpmnCanvas.viewbox();
          container.classList.add('panning');
          document.body.style.userSelect = 'none';
        }
      });

      document.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        
        e.preventDefault();
        e.stopPropagation();
        const deltaX = e.clientX - startX;
        const deltaY = e.clientY - startY;
        
        const scale = startViewbox.scale || 1;
        const moveX = -deltaX / scale;
        const moveY = -deltaY / scale;
        
        bpmnCanvas.viewbox({
          x: startViewbox.x + moveX,
          y: startViewbox.y + moveY,
          width: startViewbox.width,
          height: startViewbox.height
        });
      });

      document.addEventListener('mouseup', (e) => {
        if (isPanning) {
          isPanning = false;
          container.classList.remove('panning');
          document.body.style.userSelect = '';
        }
      });

      document.addEventListener('mouseleave', (e) => {
        if (isPanning) {
          isPanning = false;
          container.classList.remove('panning');
          document.body.style.userSelect = '';
        }
      });

      const hint = document.createElement('div');
      hint.className = 'pan-hint';
      hint.textContent = 'Hold Ctrl and drag to pan, or use middle-click+drag';
      container.appendChild(hint);

      setTimeout(() => {
        if (hint.parentNode) {
          hint.style.opacity = '0';
          hint.style.transition = 'opacity 1s';
          setTimeout(() => hint.remove(), 1000);
        }
      }, 5000);
    }

    /**

    /**
     * Load and display a diagram file (BPMN or DMN) from the server.
     * Determines the file type and delegates to appropriate rendering function.
     * @param {string} fileName - The name of the diagram file to load (with extension)
     */
    function loadDiagram(fileName) {
      // Update header
      const headerElement = getCurrentDiagram();
      headerElement.textContent = `Loading: ${fileName}`;
      
      const isDMN = fileName.endsWith('.dmn');
      const xmlUrl = `/diagrams/${fileName}`;
      const jsonUrl = `/diagrams/${fileName.replace(/\.(bpmn|dmn)/, '.json')}`;

      Promise.all([
        fetch(addSessionParam(xmlUrl)).then(res => res.text()),
        fetch(addSessionParam(jsonUrl)).then(res => res.json()).catch(() => ({}))
      ])
      .then(([xml, pathData]) => {
        
        // Add filename to pathData for decision matching
        pathData.fileName = fileName;
        
        // Update header with loaded diagram
        const displayName = fileName.replace(/-.+\.(bpmn|dmn)$/, '').replace(/\.(bpmn|dmn)$/, '');
        headerElement.textContent = `${isDMN ? 'Decision' : 'Process'}: ${displayName}`;
        
        // Clear the canvas
        const canvas = getCanvas();
        canvas.innerHTML = '';
        
        // Destroy existing viewers
        if (currentViewer) {
          try {
            currentViewer.destroy();
          } catch (e) {
            // Viewer destruction failed - continue anyway
          }
          currentViewer = null;
        }

        if (fileName.endsWith('.bpmn')) {
          loadBpmnDiagram(xml, pathData);
        } else if (fileName.endsWith('.dmn')) {
          loadDmnDiagram(xml, pathData);
        }
      }).catch(err => {
        console.error('Failed to load diagram:', err);
        headerElement.textContent = `Error loading: ${fileName}`;
      });
    }

    /**
     * Load and render a BPMN diagram using the bpmn-js viewer.
     * Handles pan controls setup and execution path highlighting.
     * @param {string} xml - The BPMN XML content to render
     * @param {Object} pathData - Execution path data for highlighting activity instances
     */
    function loadBpmnDiagram(xml, pathData) {
      // Reset table zoom when loading new diagram
      tableZoomLevel = 1.0;
      originalZoomLevel = 1.0; // Will be updated after fit-viewport completes
      
      const canvas = getCanvas();
      
      // Create container div for BPMN with zoom controls
      const containerDiv = document.createElement('div');
      containerDiv.className = 'viewer-container';
      
      // Remove any existing zoom controls and add new ones for BPMN
      createZoomControls();
      
      const viewerContainer = document.createElement('div');
      viewerContainer.className = 'viewer-inner';
      containerDiv.appendChild(viewerContainer);
      
      canvas.innerHTML = '';
      canvas.appendChild(containerDiv);
      
      bpmnViewer = new BpmnJS({ 
        container: viewerContainer,
        keyboard: {
          bindTo: window
        }
      });
      currentViewer = bpmnViewer;
      
      bpmnViewer.importXML(xml).then((result) => {
        
        try {
          const bpmnCanvas = bpmnViewer.get('canvas');
          const viewport = bpmnCanvas.viewbox();
          
          bpmnCanvas.zoom('fit-viewport');
          
          // Get the actual zoom level after fit-viewport and sync our tracking variable
          setTimeout(() => {
            try {
              const actualZoom = bpmnCanvas.zoom();
              if (actualZoom && !isNaN(actualZoom)) {
                tableZoomLevel = actualZoom;
                originalZoomLevel = actualZoom; // Store the original zoom level for reset function
                // Update the zoom input to reflect the actual zoom level
                const zoomInput = document.querySelector('.zoom-input');
                if (zoomInput) {
                  zoomInput.value = Math.round(tableZoomLevel * 100);
                }
              }
            } catch (e) {
              console.warn('Could not sync zoom level after fit-viewport:', e);
            }
          }, 100);
          
          // Add pan/drag functionality to BPMN viewer
          setupBpmnPanControls(bpmnCanvas, viewerContainer);
          
          // Add highlighting with light blue background
          (pathData.executedActivities || []).forEach(id => {
            try {
              bpmnCanvas.addMarker(id, 'highlight');
              
              setTimeout(() => {
                const element = document.querySelector(`[data-element-id="${id}"]`);
                if (element) {
                  const visual = element.querySelector('.djs-visual');
                  if (visual) {
                    const shapes = visual.querySelectorAll('rect, circle, ellipse, path, polygon');
                    shapes.forEach(shape => {
                      shape.style.fill = 'rgba(173, 216, 230, 0.6)';
                      shape.style.stroke = '#1976d2';
                      shape.style.strokeWidth = '2px';
                    });
                  }
                  
                  const textElements = element.querySelectorAll('text, tspan');
                  textElements.forEach(text => {
                    text.style.fill = '#000';
                    text.classList.add('text-black');
                  });
                  
                  const labels = element.querySelectorAll('.djs-label text, .djs-label tspan');
                  labels.forEach(label => {
                    label.style.fill = '#000';
                    label.classList.add('text-black');
                  });
                }
              }, 100);
            } catch (e) {
              // Could not highlight element - element may not exist
            }
          });
          
        } catch (e) {
          console.error('Error accessing BPMN canvas:', e);
        }
        
        // Set up mouse wheel zoom support for BPMN
        setupTableZoomMouseWheel();
        updateCopyTableButtonVisibility();
        
      }).catch(err => {
        console.error('BPMN load failed:', err);
      });
    }

    /**

    function loadDmnDiagram(xml, pathData) {
